<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>书源工坊 · 零基础做书源</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a22; --card:#1a2029; --card2:#212836;
  --line:#2a3240; --line2:#374151;
  --txt:#e6edf7; --txt2:#9aa7ba; --txt3:#66748a;
  --acc:#48b8ff; --acc2:#2b8fd6; --ok:#3ddc84; --warn:#ffb648; --err:#ff6b6b;
  --purple:#b08cff; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.5; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
input,textarea,select,button{font-family:inherit;font-size:15px;color:inherit}
::-webkit-scrollbar{width:0;height:0}
.hide{display:none!important}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:rgba(14,17,22,.94); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hbtn{
  flex:none;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:.15s;padding:0;
}
.hbtn:active{transform:scale(.93);background:var(--card2)}
.htitle{flex:1;min-width:0}
.htitle .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .sub{font-size:10.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--txt3);margin-right:5px;vertical-align:1px}
.dot.on{background:var(--ok);box-shadow:0 0 6px rgba(61,220,132,.6)}

/* ---------- 主体 ---------- */
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 78px)}
.page{display:none;animation:fade .18s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 9px;font-size:12px;color:var(--txt3)}
.sec-h b{color:var(--txt2);font-weight:600;font-size:12.5px}
.sec-h .ln{flex:1;height:1px;background:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card+.card{margin-top:10px}

/* 字段 */
.f{margin-bottom:15px}
.f:last-child{margin-bottom:0}
.f-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.f-l{font-size:12.5px;color:var(--txt2);font-weight:500}
.badge{font-size:9.5px;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--txt3);border:1px solid var(--line);white-space:nowrap}
.badge.p{background:rgba(176,140,255,.14);color:var(--purple);border-color:rgba(176,140,255,.28)}
.badge.r{background:rgba(72,184,255,.13);color:var(--acc);border-color:rgba(72,184,255,.28)}
.badge.g{background:rgba(61,220,132,.12);color:var(--ok);border-color:rgba(61,220,132,.26)}
.badge.y{background:rgba(255,182,72,.12);color:var(--warn);border-color:rgba(255,182,72,.28)}
.f-h .sp{flex:1}

input[type=text],input[type=url],input[type=number],textarea,select{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;color:var(--txt);outline:none;transition:.15s;font-size:15px;
  -webkit-appearance:none;
}
input::placeholder,textarea::placeholder{color:#4d5a6d}
input:focus,textarea:focus,select:focus{border-color:var(--acc2);background:#11161e;box-shadow:0 0 0 3px rgba(72,184,255,.1)}
textarea{resize:vertical;min-height:60px;line-height:1.5}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.f-tip{font-size:11.5px;color:var(--txt3);margin-top:5px;line-height:1.5}
.f-tip b{color:var(--txt2);font-weight:500}

/* 开关行 */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rl{flex:1;font-size:13.5px}
.row .rd{font-size:11px;color:var(--txt3)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:.2s;cursor:pointer;border:0;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a97a8;transition:.2s}
.sw.on{background:rgba(72,184,255,.35)}
.sw.on::after{left:21px;background:var(--acc);box-shadow:0 0 8px rgba(72,184,255,.7)}

/* 分段控件 */
.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{
  flex:1;border:0;background:transparent;color:var(--txt2);padding:8px 4px;border-radius:9px;
  font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;
}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:14px;font-weight:500;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#3fa9ec,#2b8fd6);border-color:#2b8fd6;color:#fff;font-weight:600}
.btn.ok{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.4);color:var(--ok)}
.btn.warn{background:rgba(255,182,72,.12);border-color:rgba(255,182,72,.35);color:var(--warn)}
.btn.gho{background:transparent}
.btn.wide{width:100%;padding:13px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* 向导 */
.wsteps{display:flex;align-items:center;gap:1px;margin:2px 0 16px;padding:0 2px;overflow:hidden}
.wstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.wstep .c{
  width:21px;height:21px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--txt3);
  font-weight:600;transition:.2s;z-index:2;flex:none;
}
.wstep .lb{font-size:9px;color:var(--txt3);white-space:nowrap;transform:scale(.9)}
.wstep.done .c{background:rgba(61,220,132,.15);border-color:rgba(61,220,132,.45);color:var(--ok)}
.wstep.cur .c{background:var(--acc2);border-color:var(--acc);color:#fff;box-shadow:0 0 0 3px rgba(72,184,255,.16)}
.wstep.cur .lb{color:var(--acc)}
.wstep::before{content:'';position:absolute;top:10px;left:-50%;width:100%;height:1px;background:var(--line);z-index:1}
.wstep:first-child::before{display:none}
.wstep.done::before,.wstep.cur::before{background:rgba(61,220,132,.4)}

.wiz-t{font-size:17px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.wiz-d{font-size:13px;color:var(--txt2);line-height:1.65;margin:0 0 14px}
.wiz-d b{color:var(--txt);font-weight:600}
.wiz-d em{color:var(--acc);font-style:normal;font-weight:600}

.ol{padding-left:18px;margin:8px 0 0;font-size:13px;color:var(--txt2);line-height:1.8}
.ol li{margin-bottom:4px}
.ol li b{color:var(--txt)}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:rgba(72,184,255,.1);border:1px solid rgba(72,184,255,.22);color:#8fcdf5;font-size:11px;
}

/* 已选规则回显 */
.picked{
  display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:12.5px;
}
.picked .pk{flex:none;width:60px;color:var(--txt3);font-size:11px}
.picked .pv{flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:11.5px;
  color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked.miss .pv{color:var(--err);font-family:inherit;font-style:italic}

/* 测试区 */
.tstep{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.tstep-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tnum{width:21px;height:21px;border-radius:7px;background:var(--card2);color:var(--txt2);font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tnum.done{background:rgba(61,220,132,.16);color:var(--ok)}
.tnum.err{background:rgba(255,107,107,.16);color:var(--err)}
.tnum.run{background:rgba(72,184,255,.16);color:var(--acc)}
.tstep-h .tt{font-size:13.5px;font-weight:600;flex:1}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1}

.res-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.book{
  display:flex;gap:10px;padding:9px;background:var(--bg2);border:1px solid var(--line);
  border-radius:11px;cursor:pointer;transition:.15s;
}
.book:active{background:var(--card2)}
.book img{width:44px;height:60px;border-radius:7px;object-fit:cover;background:var(--card2);flex:none}
.book .bi{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.book .bn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .ba{font-size:11.5px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .bm{font-size:10.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .go{display:flex;align-items:center;color:var(--txt3);font-size:15px}

.chap{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;margin-top:7px;font-size:13px;cursor:pointer}
.chap:active{background:var(--card2)}
.chap .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.kv{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--txt3);flex:none;width:58px;font-size:11.5px;padding-top:1px}
.kv .v{flex:1;min-width:0;word-break:break-all}
.kv .v.miss{color:var(--txt3);font-style:italic}

.mono-box{background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.65;
  color:#b8c6da;max-height:250px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.mono-box.sm{max-height:160px;font-size:11px}

.note{
  display:flex;gap:8px;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.55;
  background:rgba(72,184,255,.07);border:1px solid rgba(72,184,255,.18);color:#a9cbe8;
}
.note.warn{background:rgba(255,182,72,.07);border-color:rgba(255,182,72,.2);color:#e8cfa9}
.note.err{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.24);color:#f0b0b0}
.note.ok{background:rgba(61,220,132,.07);border-color:rgba(61,220,132,.2);color:#a9e8c4}
.note .ico{flex:none}

/* 底部导航 */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:flex;background:rgba(18,22,29,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabbar button{
  flex:1;border:0;background:transparent;color:var(--txt3);padding:8px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  font-size:10px;transition:.15s;
}
nav.tabbar button .ic{font-size:17px;line-height:1.1;filter:grayscale(1) opacity(.5);transition:.15s}
nav.tabbar button.on{color:var(--acc)}
nav.tabbar button.on .ic{filter:none;transform:translateY(-1px)}

/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:86%;max-width:340px;z-index:61;
  background:var(--bg2);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .24s cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 10px);
}
.drawer.on{transform:none}
.drawer-h{padding:6px 14px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.drawer-h .t{flex:1;font-size:15px;font-weight:600}
.drawer-b{flex:1;overflow:auto;padding:10px 12px}
.libitem{
  display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;
}
.libitem.on{border-color:var(--acc2);background:rgba(72,184,255,.07)}
.libitem .li{flex:1;min-width:0}
.libitem .ln{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libitem .ls{font-size:10.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--txt3);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;padding:0}

/* ---------- 分类选择 ---------- */
.catlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.cat{
  display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:9px;
  background:var(--bg2);border:1px solid var(--line);font-size:12.5px;color:var(--txt2);
  cursor:pointer;transition:.15s;user-select:none;line-height:1.2;
}
.cat.on{background:rgba(72,184,255,.14);border-color:rgba(72,184,255,.45);color:#bfe4ff}
.cat .tick{font-size:10px;opacity:.55}
.cat.on .tick{opacity:1}
.catlist-acts{display:flex;align-items:center;gap:10px;margin-top:11px}
.catlist-acts .sp{flex:1}
.mini{font-size:11px;color:var(--txt3);background:none;border:0;cursor:pointer;padding:4px 0;
  text-decoration:underline;text-underline-offset:2px;font-family:inherit}
.mini:active{color:var(--txt2)}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translate(-50%,12px);
  background:rgba(35,44,58,.98);border:1px solid var(--line2);color:var(--txt);
  padding:10px 18px;border-radius:22px;font-size:12.5px;z-index:99;opacity:0;pointer-events:none;
  transition:.22s;max-width:84vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);line-height:1.5;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 点选器（全屏） ============ */
.pick{position:fixed;inset:0;z-index:70;background:#0b0e13;display:none;flex-direction:column}
.pick.on{display:flex}
.pick-top{
  background:var(--card);border-bottom:1px solid var(--line);flex:none;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
}
.pick-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pick-bar .pt{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-hint{font-size:11.5px;color:var(--txt2);line-height:1.5;margin-bottom:8px}
.pick-hint b{color:var(--acc)}
.pick-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:0 -2px}
.chip{
  flex:none;padding:6px 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);
  color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.chip.on{background:rgba(72,184,255,.16);border-color:var(--acc);color:var(--acc);font-weight:600}
.chip.filled{border-color:rgba(61,220,132,.45);color:var(--ok)}
.chip.filled.on{background:rgba(61,220,132,.16)}
.pick-frame{flex:1;position:relative;background:#fff;overflow:hidden}
.pick-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.pick-frame .loading{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:#0b0e13;color:var(--txt2);font-size:13px;
}
.spin{width:26px;height:26px;border:2px solid rgba(72,184,255,.25);border-top-color:var(--acc);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pick-bottom{
  flex:none;background:var(--card);border-top:1px solid var(--line);
  padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
  display:flex;align-items:center;gap:8px;
}
.pick-sel{flex:1;min-width:0;font-size:11px;color:var(--txt3)}
.pick-sel .sv{display:block;font-family:ui-monospace,monospace;font-size:11px;color:var(--acc);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 语法速查 */
.cheat{font-size:12px;color:var(--txt2);line-height:1.7}
.cheat code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-family:ui-monospace,monospace;font-size:11px;color:var(--acc);margin:0 1px}
.cheat .cr{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cheat .cr:last-child{border:0}
.cheat .cr b{flex:none;width:88px;color:var(--txt);font-weight:500;font-size:11.5px}
details summary{cursor:pointer;list-style:none;font-size:12.5px;color:var(--txt2);padding:3px 0}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸ ';color:var(--txt3)}
details[open] summary::before{content:'▾ '}

.sep{height:1px;background:var(--line);margin:14px 0}
.tiny{font-size:11px;color:var(--txt3);line-height:1.55}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.center{text-align:center}
</style>
</head>
<body>

<header>
  <button class="hbtn" id="btnDrawer" aria-label="书源库">☰</button>
  <div class="htitle">
    <div class="nm" id="hName">新书源</div>
    <div class="sub"><span class="dot" id="hDot"></span><span id="hSub">草稿自动保存</span></div>
  </div>
  <button class="hbtn" id="btnNew" aria-label="新建" title="新建书源">＋</button>
  <button class="hbtn" id="btnSave" aria-label="保存" title="保存">✓</button>
</header>

<main>
  <section class="page on" data-page="wizard"><div id="pageWizard"></div></section>
  <section class="page" data-page="rules"><div id="pageRules"></div></section>
  <section class="page" data-page="test"><div id="pageTest"></div></section>
  <section class="page" data-page="ai"><div id="pageAI"></div></section>
  <section class="page" data-page="export"><div id="pageExport"></div></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="on" data-tab="wizard"><span class="ic">🪄</span>向导</button>
  <button data-tab="ai"><span class="ic">🤖</span>AI制作</button>
  <button data-tab="rules"><span class="ic">🎯</span>规则</button>
  <button data-tab="test"><span class="ic">🔍</span>测试</button>
  <button data-tab="export"><span class="ic">📦</span>导出</button>
</nav>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <div class="t">我的书源</div>
    <button class="btn sm gho" id="btnImport">导入</button>
    <button class="btn sm pri" id="btnAddLib">新建</button>
  </div>
  <div class="drawer-b" id="libList"></div>
</aside>

<!-- 点选器 -->
<div class="pick" id="pick">
  <div class="pick-top">
    <div class="pick-bar">

  if(!s || typeof s !== 'object') return blankSource();
  const b = blankSource();
  Object.keys(b).forEach(k=>{
    if(s[k] === undefined) s[k] = b[k];

    Object.keys(b[g]).forEach(k=>{ if(s[g][k] === undefined) s[g][k] = b[g][k]; });
  });
  if(typeof s._step !== 'number') s._step = 0;
  return s;
}

/* 基础信息字段 */
const BASE_FIELDS = [
  { k:'bookSourceName', l:'书源名称', ph:'例：某某小说网', tip:'在阅读 App 的书源列表里显示的名字，随便起。' },

/* 判断是否配好了某个模块 */
function hasMod(m){
  const f = SCHEMA[m].fields.filter(x=>x.k.includes('bookList')||x.k.includes('chapterList')||x.k.endsWith('.content')||x.k==='ruleBookInfo.name');
  return f.every(x=> clean(getS(x.k)) !== '');
}
/* 核心 4 项（不含可选的「发现」） */
function coreCount(){
  let n = 0;
  if(clean(S.bookSourceUrl) && clean(S.searchUrl)) n++;
  if(hasMod('search')) n++;
  if(hasMod('toc')) n++;
  if(hasMod('content')) n++;
  return n;

/* 含「发现」在内的总完成项 */
function doneCount(){

}

/* ============================================================
   Part 2 · 抓取层（跨域代理 + 自动识别编码）
   ============================================================ */
function decodeBuf(buf){
  let enc = 'utf-8';
  try{
    const head = new TextDecoder('latin1').decode(buf.slice(0, 5120)).toLowerCase();
    const m = head.match(/charset\s*=\s*["']?\s*([\w-]+)/);
    if(m){
      const c = m[1];
      if(/^(gb|gbk|gb2312|gb18030|x-gbk)/.test(c)) enc = 'gbk';
      else if(/^big5/.test(c)) enc = 'big5';
    }
  }catch(e){}
  let txt = '';
  try{ txt = new TextDecoder(enc).decode(buf); }catch(e){ txt = new TextDecoder('utf-8').decode(buf); }
  if(enc === 'utf-8'){
    const bad = (txt.match(/\uFFFD/g)||[]).length;
    if(bad > 3){ try{ txt = new TextDecoder('gbk').decode(buf); }catch(e){} }
  }
  return txt;
}

async function fetchOne(url, timeout=18000){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), timeout);
  try{
    const r = await fetch(url, { signal:ctl.signal, redirect:'follow' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.arrayBuffer();
  } finally { clearTimeout(timer); }
}

/** 当前可用的代理顺序：自定义优先，其次内置池 */
function proxyList(){
  const arr = [];
  const cp = clean(CFG.customProxy || '');
  if(cp){
    arr.push({ name:'自定义代理', build:u=>
      cp.includes('{url}') ? cp.replace('{url}', encodeURIComponent(u)) : cp + encodeURIComponent(u) });
  }
  for(const p of PROXIES) arr.push(p);
  return arr;
}

/** 用代理抓网页，返回解码后的 HTML 文本 */
async function grab(url){
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const list = proxyList();
  const order = list.slice(CFG.proxy).concat(list.slice(0, CFG.proxy));
  const errs = [];
  for(const p of order){
    try{
      const buf = await fetchOne(p.build(url));
      const txt = decodeBuf(buf);
      if(txt && txt.trim().length > 120){
        CFG.proxy = list.indexOf(p);
        if(!/<html|<\?xml|<body|<div|<\?|<rss/i.test(txt) && txt.length < 400){
          errs.push(p.name + ': 返回内容异常'); continue;
        }
        return { html: txt, proxy: p.name };
      }
      errs.push(p.name + ': 内容为空');
    }catch(e){ errs.push(p.name + ': ' + (e.name === 'AbortError' ? '超时' : e.message)); }
  }
  const err = new Error('NETFAIL|' + errs.join('\n'));
  err.netfail = true;
  throw err;
}

/** 把 HTML 解析成 Document，并注入 base 便于相对链接还原 */
function parseHtml(html, base){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.__base = base || '';
  return doc;
}

/** 抓取并解析 */
async function grabDoc(url){
  const key = url;
  if(T.pages[key]) return T.pages[key];
  const { html, proxy } = await grab(url);
  const doc = parseHtml(html, url);
  const pack = { doc, html, base: url, proxy };
  T.pages[key] = pack;
  return pack;
}

/* ============================================================
   Part 3 · 规则引擎（在浏览器里模拟 Legado 的 Jsoup 规则）
   ============================================================ */
const EMPTY = { els:[], text:'', list:[] };
const ATTR_RE = /^(text|ownText|html|all|outerHtml|href|src|content|title|alt|value|poster)$/i;

function cssSeg(seg){
  seg = String(seg).trim();
  if(/^class\./i.test(seg)) return '.' + seg.slice(6);
  if(/^id\./i.test(seg))    return '#' + seg.slice(3);
  if(/^tag\./i.test(seg))   return seg.slice(4);
  if(/^text\./i.test(seg))  return seg.slice(5);
  return seg;
}
function splitIdx(seg){
  let m = seg.match(/^(.*?)(?:\.(-?\d+))$/);
  if(m && m[1] && !/^\./.test(m[1])) return { s:m[1], i:parseInt(m[2],10) };
  m = seg.match(/^(.*?)!(-?\d+)$/);
  if(m && m[1]) return { s:m[1], i:parseInt(m[2],10) };
  return { s:seg, i:null };
}
function ownText(n){
  let t = '';
  n.childNodes.forEach(c=>{ if(c.nodeType === 3) t += c.textContent; });
  return clean(t);
}
function getAttrVal(n, attr, base){
  const a = attr.replace(/!-?\d+$/,'');
  if(/^text$/i.test(a))     return clean(n.textContent);
  if(/^ownText$/i.test(a))  return ownText(n);
  if(/^html$/i.test(a))     return n.innerHTML != null ? n.innerHTML : '';
  if(/^all$|^outerHtml$/i.test(a)) return n.outerHTML != null ? n.outerHTML : '';
  let v = n.getAttribute ? n.getAttribute(a) : null;
  if(v == null) return '';
  if(/^(href|src|poster|data-src|data-original)$/i.test(a)) v = absUrl(v, base);
  return v;
}

/** 核心：解析一条规则，返回 {els, text} */
function resolveRule(rule, roots, base){
  const EMPTY_LOCAL = { els:[], text:'' };
  rule = String(rule == null ? '' : rule).trim();
  if(!rule) return EMPTY_LOCAL;
  if(!roots || !roots.length) roots = [document];
  if(!base){
    const r0 = roots[0];
    const d = (r0 && r0.ownerDocument) || r0;
    base = (d && d.__base) || '';
  }

  // 或：||
  if(rule.includes('||')){
    for(const part of rule.split('||')){
      const r = resolveRule(part.trim(), roots, base);
      if((r.els && r.els.length) || clean(r.text)) return r;
    }
    return EMPTY_LOCAL;
  }
  // JS 规则
  if(/^@?js:/i.test(rule) || /^<js>/i.test(rule)){
    return { els:[], text:'〔JS 规则 · 需在阅读 App 内运行，本地测试请跳过〕' };
  }
  // 正则截取 :regex
  if(/^:/.test(rule)){
    const src = roots.map(r=> (r.outerHTML || (r.documentElement && r.documentElement.outerHTML) || '')).join('');
    try{
      const m = new RegExp(rule.slice(1), 'i').exec(src);
      if(m) return { els:[], text: clean(m[1] != null ? m[1] : m[0]) };
    }catch(e){ return { els:[], text:'〔正则写法有误：'+e.message+'〕' }; }
    return EMPTY_LOCAL;
  }
  // JSONPath
  if(/^\$[.\[]/.test(rule)) return resolveJson(rule, roots, base);

  // CSS 链
  const segs = rule.split('@').map(s=>s.trim()).filter(s=>s !== '');
  let attr = null;
  if(segs.length){
    const last = segs[segs.length-1];
    const bare = last.replace(/!-?\d+$/,'');
    if(ATTR_RE.test(bare) || (/^[A-Za-z][\w-]*$/.test(bare) && !/^[^\s]*[.\[]/.test(bare))){
      attr = last; segs.pop();
    }
  }
  let nodes = roots.slice();
  for(const raw of segs){
    const { s, i } = splitIdx(raw);
    const css = cssSeg(s);
    if(!css) continue;
    const next = [];
    for(const n of nodes){
      try{ next.push(...n.querySelectorAll(css)); }catch(e){ /* 非法选择器 */ }
    }
    nodes = next;
    if(i !== null && nodes.length){
      const p = i < 0 ? nodes.length + i : i;
      nodes = nodes[p] ? [nodes[p]] : [];
    }
    if(!nodes.length) return EMPTY_LOCAL;
  }
  if(attr){
    const vals = nodes.map(n=>getAttrVal(n, attr, base)).filter(v=>v !== '' && v != null);
    return { els:nodes, text: vals.join('\n') };
  }
  return { els:nodes, text: nodes.map(n=>clean(n.textContent)).join('\n') };
}

function resolveJson(rule, roots, base){
  const src = roots.map(r=> (r.__raw || r.textContent || '')).join('');
  let data;
  try{ data = JSON.parse(src); }catch(e){
    // 可能是 HTML 里嵌的 JSON，尝试取第一个 { 到最后一个 }
    const a = src.indexOf('{'), b = src.lastIndexOf('}');
    if(a>=0 && b>a){ try{ data = JSON.parse(src.slice(a,b+1)); }catch(e2){} }
  }
  if(data === undefined) return { els:[], text:'〔JSONPath 需要 JSON 数据，当前页面是 HTML〕' };
  const parts = rule.replace(/^\$\.?/,'').split(/\.(?![^\[]*\])/).filter(Boolean);
  let cur = data;
  for(const p of parts){
    if(cur == null) break;
    const m = p.match(/^([\w\-\u4e00-\u9fa5]*)\[(\d+|\*)\]$/);
    if(m){
      if(m[1]) cur = cur[m[1]];
      if(Array.isArray(cur)) cur = m[2]==='*' ? cur : cur[parseInt(m[2],10)];
    } else if(p === '*'){
      if(Array.isArray(cur)) return { els:[], text: cur.join('\n') };
      return { els:[], text: String(cur) };
    } else {
      cur = cur[p];
    }
  }
  if(Array.isArray(cur)) return { els:[], text: cur.join('\n') };
  if(typeof cur === 'object') return { els:[], text: JSON.stringify(cur) };
  return { els:[], text: cur == null ? '' : String(cur) };
}

/** 便捷取值 */
function ruleVal(rule, el, base){
  const r = resolveRule(rule, el ? [el] : [document], base);
  return clean((r.text || '').split('\n')[0]);
}

/* ============================================================
   Part 4 · 选择器生成器（点选器的"大脑"）
   ============================================================ */
function segOf(el){
  const doc = el.ownerDocument || document;
  const tag = el.tagName.toLowerCase();
  const id = el.getAttribute('id');
  if(id && /^[A-Za-z][\w-]*$/.test(id)){
    try{ if(doc.querySelectorAll('#'+id).length <= 1) return 'id.' + id; }catch(e){}
  }
  const cls = [...el.classList].filter(c=>/^[A-Za-z][\w-]*$/.test(c) && !/^(active|on|cur|current|hover|show|open|selected|clearfix|row|col|item|list|box|wrap|main|content)$/.test(c));
  if(cls.length){
    // 优先挑一个在该页出现次数较少的 class
    const scored = cls.map(c=>({ c, n: doc.getElementsByClassName(c).length }))
                      .sort((a,b)=>a.n - b.n);
    return 'class.' + scored[0].c;
  }
  return 'tag.' + tag;
}

/** 从 root 内定位 el 的最短规则（不含属性） */
function shortestPath(root, el, allowMany){
  const doc = el.ownerDocument || document;
  const stop = doc.documentElement;
  const chain = [];
  let cur = el;
  while(cur && cur !== root && cur !== stop && cur !== doc.body){
    chain.unshift(cur);
    cur = cur.parentElement;
  }
  if(!chain.length) return '';
  // 由短到长，先找到能用的最短写法
  for(let start = chain.length - 1; start >= 0; start--){
    const rule = chain.slice(start).map(e=>segOf(e)).join('@');
    const hits = resolveRule(rule, [root]).els;
    if(allowMany ? hits.length >= 1 : (hits.length === 1 && hits[0] === el)){
      return rule;
    }
  }
  return chain.map(e=>segOf(e)).join('@');
}

/** 从整个文档定位 el 的最短规则 */
function pathFromDoc(el){
  const doc = el.ownerDocument || document;
  return shortestPath(doc.documentElement, el, false) || shortestPath(doc.body, el, false);
}

/** 用户点中"一本书/一个章节"时，猜出列表规则 */
function guessListRule(el){
  const doc = el.ownerDocument || document;
  const cands = [];
  let cur = el;
  let depth = 0;
  while(cur && cur !== doc.documentElement && depth < 9){
    if(cur.parentElement && cur !== doc.body){
      const rule = shortestPath(doc.documentElement, cur, true);
      const hits = resolveRule(rule, [doc.documentElement]).els;
      const covers = hits.some(h=> h === el || (h.contains && h.contains(el)));
      if(hits.length >= 2 && hits.length <= 3000 && covers && rule){
        cands.push({ rule, n: hits.length, el: cur, text: clean(cur.textContent).length, depth });
      }
    }
    cur = cur.parentElement; depth++;
  }
  if(!cands.length) return null;
  // 命中数最少的优先；并列时取"信息量更大"的那一层（一张书卡 > 只含书名的标题）
  cands.sort((a,b)=> (a.n - b.n) || (b.text - a.text) || (a.depth - b.depth));
  return cands[0];
}

/** 找 el 自身或最近的 a/img 祖先 */
function nearestTag(el, tag){
  const doc = el.ownerDocument || document;
  let cur = el;
  while(cur && cur !== doc.body){
    if(cur.tagName && cur.tagName.toLowerCase() === tag) return cur;
    cur = cur.parentElement;
  }
  return null;
}

/**
 * 为一个点中的元素生成"字段规则"
 * kind: text | url | img | html | list
 * listKey: 该字段所在的列表规则（如 ruleSearch.bookList），有值时生成"相对列表项"的规则
 */
function buildRule(el, kind, listKey){
  const doc = el.ownerDocument || document;

  if(kind === 'list'){
    const g = guessListRule(el);
    if(!g) return { rule:'', count:0, note:'没能识别出列表结构，试着点得靠外一点（整张卡片的空白处）' };
    return { rule:g.rule, count:g.n, note:`✓ 识别到 ${g.n} 个同类项` };
  }

  let target = el, attr = 'text';
  if(kind === 'url'){
    const a = nearestTag(el, 'a');
    if(a){ target = a; attr = 'href'; }
    else return { rule:'', count:0, note:'这里没有链接，请点书名或封面上' };
  }
  if(kind === 'img'){
    const img = nearestTag(el, 'img');
    if(img){ target = img; attr = 'src'; }
    else return { rule:'', count:0, note:'这里没有图片，请点封面上' };
  }
  if(kind === 'html'){
    attr = 'html';
    // 点正文时常常点在某一段上，自动上提到"装正文的那个大盒子"
    let cur = target;
    let guard = 0;
    while(cur.parentElement && guard++ < 5
          && cur.parentElement !== doc.body && cur.parentElement !== doc.documentElement){
      const cl = clean(cur.textContent).length;
      const pl = clean(cur.parentElement.textContent).length;
      if(pl > cl * 1.5 && pl - cl > 50) cur = cur.parentElement;
      else break;
    }
    target = cur;
  }

  // 找一个"列表项"作为相对基准
  let base = null;
  if(listKey && clean(getS(listKey))){
    try{
      const items = resolveRule(getS(listKey), [doc.documentElement]).els;
      base = items.find(it=> it.contains(target)) || null;
    }catch(e){}
  }

  const p = base ? shortestPath(base, target, false) : pathFromDoc(target);
  const rule = p ? p + '@' + attr : '@' + attr;
  const r = resolveRule(rule, [base || doc.documentElement]);
  const v = clean((r.text||'').split('\n')[0]);
  return { rule, count: r.els.length, value: v, base,
    note: v ? '✓ 取到：' + trunc(v, 46) : '⚠ 没取到内容，换个位置点' };
}

/* ============================================================
   Part 5 · 地址推导（帮小白把搜索网址变成 {{key}}）
   ============================================================ */
function buildSearchUrl(pageUrl, keyword){
  let u = pageUrl.trim();
  if(!/^https?:/i.test(u)) u = 'https://' + u;
  let result = u, hit = false;
  if(keyword){
    const k = keyword.trim();
    if(k && result.includes(k)){
      result = result.split(k).join('{{key}}');
      hit = true;
    } else if(k){
      const enc = encodeURIComponent(k);
      if(result.toLowerCase().includes(enc.toLowerCase())){
        result = result.replace(new RegExp(enc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), '{{key}}');
        hit = true;
      }
    }
  }
  // 没命中就用常见参数名兜底
  if(!hit){
    try{
      const o = new URL(result);
      const keys = ['q','key','keyword','wd','searchkey','searchKey','searchword','s','query','kw','search'];
      for(const k of keys){
        if(o.searchParams.has(k)){
          result = result.replace(/([?&])((?:q|key|keyword|wd|searchkey|searchKey|searchword|s|query|kw|search))=([^&]*)/i, (m,a,b)=> a + b + '={{key}}');
          hit = true; break;
        }
      }
    }catch(e){}
  }
  // 与站点首页相同的部分转成相对路径，更通用
  const base = (S && S.bookSourceUrl) ? S.bookSourceUrl.replace(/\/+$/,'') : '';
  if(hit && base && result.startsWith(base + '/')){
    result = result.slice(base.length) || '/';
  }
  return { url: result, ok: hit };
}

/* ============================================================
   Part 5.5 · 发现 / 分类（exploreUrl）
   ============================================================ */
const GENRE_WORDS = /玄幻|奇幻|武侠|仙侠|修真|修仙|都市|历史|军事|科幻|灵异|惊悚|悬疑|推理|游戏|竞技|体育|女生|言情|穿越|重生|二次元|N次元|轻小说|完本|排行|推荐|新书|全本|其他/;
const NAV_STOP = /^(首页|主页|书架|书库|我的|登录|注册|退出|搜索|客服|帮助|下载|客户端|电脑版|手机版|设置|充值|投稿|作者|版权|广告|关于|联系|返回|上一页|下一页|更多|全部|目录|免费|最新|历史记录)$/;

/** 把 exploreUrl 文本拆成 [{name,url}] */
function parseExplore(text){
  return String(text||'').split(/\r?\n|&&/).map(s=>s.trim()).filter(Boolean).map(line=>{
    const i = line.indexOf('::');
    if(i < 0) return { name:'', url: line };
    return { name: line.slice(0,i).trim(), url: line.slice(i+2).trim() };
  }).filter(x=> x.name && x.url);
}

/** 反方向：从分类数组生成 exploreUrl 文本 */
function buildExploreUrl(items){
  return (items||[]).filter(x=> x.name && x.url)
    .map(x=> x.name + '::' + x.url).join('\n');
}

/** 分类网址里的 {{page}} 换成真实页码（支持 page 参与简单运算） */
function explorePageUrl(raw, page){
  let u = String(raw||'').trim().replace(/^["']|["']$/g,'');
  u = u.replace(/\{\{([^{}]+)\}\}/g, (m, expr)=>{
    const e = expr.trim();
    try{
      if(/^[page\d\s+\-*/().%]+$/.test(e)) return String(Function('page','return ('+e+')')(page));
    }catch(_){}
    return m;
  });
  u = u.split('{page}').join(String(page));
  if(!/^https?:/i.test(u)){
    const base = ((S && S.bookSourceUrl) || '').replace(/\/+$/,'') + '/';
    u = absUrl(u, base);
  }
  return u;
}

/** 猜出分类页的翻页写法，把页码替换成 {{page}}；猜不到返回空串 */
function pageTemplatize(u){
  if(!u || /\{\{page\}\}/.test(u)) return '';
  let m = u.match(/([?&](?:page|p|pn|pageno|pageNo|pageNum)=\d+)/i);
  if(m) return u.replace(/([?&](?:page|p|pn|pageno|pageNo|pageNum)=)\d+/i, '$1{{page}}');
  m = u.match(/^(.*?\/(?:sort|list|category|type|fenlei)\/\d+[_-])(\d+)(\.html?)(\?.*)?$/i);
  if(m) return m[1] + '{{page}}' + m[3] + (m[4] || '');
  m = u.match(/^(.*?(?:index|list|page|sort|category)[_-]?)(\d+)(\.html?)(\?.*)?$/i);
  if(m) return m[1] + '{{page}}' + m[3] + (m[4] || '');
  return '';
}

/** 从一个页面里挑出像「分类」的链接 */
function pickCategoriesFrom(doc, base){
  const h0 = host(base);
  const out = [], seenU = new Set(), seenN = new Set();
  doc.querySelectorAll('a[href]').forEach(a=>{
    const raw = a.getAttribute('href') || '';
    if(!raw || /^(javascript:|#)/i.test(raw)) return;
    const t = clean(a.textContent).replace(/[»>››\s]+$/,'').trim();
    if(!t || t.length > 10) return;
    if(NAV_STOP.test(t)) return;
    if(/^\d+$/.test(t)) return;
    const u = absUrl(raw, base);
    if(!/^https?:/i.test(u)) return;
    if(h0 && host(u) !== h0) return;
    if(/\/(book|read|chapter|txt|novel)\/?\d/i.test(u)) return;
    if(/\.(jpg|png|gif|zip|apk)$/i.test(u)) return;
    const key = u.replace(/\/+$/,'').replace(/^https?:\/\//,'');
    if(seenU.has(key) || seenN.has(t)) return;
    let score = 0;
    if(GENRE_WORDS.test(t)) score += 10;
    if(/(sort|class|category|list|type|fenlei|quanben)/i.test(u)) score += 6;
    if(t.length <= 4) score += 2;
    if(score <= 0) return;
    seenU.add(key); seenN.add(t);
    out.push({ name:t, url:u, score });
  });
  out.sort((a,b)=> b.score - a.score);
  return out.slice(0, 30);
}

/** 自动扫描：首页分类 + 能找到的「分类」总览页 */
async function scanCategories(){
  const home = clean(S.bookSourceUrl);
  if(!home) throw new Error('先把网站首页填上');
  const pack = await grabDoc(home);
  let list = pickCategoriesFrom(pack.doc, home);

  if(list.length < 8){
    try{
      const h0 = host(home);
      let catPage = '';
      pack.doc.querySelectorAll('a[href]').forEach(a=>{
        if(catPage) return;
        const t = clean(a.textContent);
        if(!/^(全部分类|作品分类|分类|分类导航|分类列表)$/.test(t)) return;
        const u = absUrl(a.getAttribute('href') || '', home);
        if(/^https?:/i.test(u) && host(u) === h0) catPage = u;
      });
      if(catPage){
        const p2 = await grabDoc(catPage);
        const seen = new Set(list.map(x=> x.name));
        pickCategoriesFrom(p2.doc, catPage).forEach(x=>{
          if(!seen.has(x.name)){ seen.add(x.name); x.url = pageTemplatize(x.url) || x.url; list.push(x); }
        });
      }
    }catch(e){ /* 分类总览页打不开也没关系，首页结果够用 */ }
  }
  return list.slice(0, 40);
}

/** 当前已配置的分类（优先用缓存的数组，其次解析 exploreUrl） */
function exploreItems(){
  if(Array.isArray(S._cats)) return S._cats;
  return parseExplore(S.exploreUrl);
}
function setExploreItems(items){
  S._cats = items;
  setS('exploreUrl', buildExploreUrl(items));
  saveLib();
}
/** 扫描列表的勾选状态 → 合并进分类清单（手动加的不丢） */
function syncScannedCats(){
  const arr = Array.isArray(S._scanCats) ? S._scanCats : [];
  const urls = new Set(arr.map(c=> c.url)), names = new Set(arr.map(c=> c.name));
  const manual = exploreItems().filter(x=> !urls.has(x.url) && !names.has(x.name));
  const picked = arr.filter(c=> c.on).map(c=> ({ name:c.name, url:c.url }));
  setExploreItems(picked.concat(manual));
}

/** 抓首页，自动猜搜索接口（支持 GET 和 POST 表单） */
const SEARCH_KEY_NAMES = /^(q|key|keyword|wd|searchkey|searchword|searchname|s|query|kw|keyboard|sn|bookname)$/i;

function formSearchUrl(f, baseUrl, siteCharset){
  const method = (f.getAttribute('method') || 'GET').toUpperCase();
  const base0 = baseUrl.replace(/\/+$/, '');
  let act = f.getAttribute('action') || '';
  if(!act){
    try{ act = new URL(baseUrl).pathname + new URL(baseUrl).search || '/'; }catch(e){ act = '/'; }
  }
  const abs = absUrl(act, baseUrl);
  let path = (base0 && abs.startsWith(base0 + '/')) ? abs.slice(base0.length) : abs;

  const parts = [];
  let kname = null;
  [...f.querySelectorAll('input')].forEach(i=>{
    const n = (i.getAttribute('name') || '').trim();
    if(!n) return;
    const type = (i.getAttribute('type') || 'text').toLowerCase();
    if(type === 'submit' || type === 'button' || type === 'image' || type === 'file') return;
    if(!kname && SEARCH_KEY_NAMES.test(n)){ kname = n; parts.push(n + '={{key}}'); return; }
    if(!kname && type === 'text' && !/^(page|typeid|classid|producelist|order|sort)$/i.test(n)){
      kname = n; parts.push(n + '={{key}}'); return;
    }
    const v = i.getAttribute('value') || '';
    parts.push(n + '=' + encodeURIComponent(v));
  });
  if(!kname) return null;

  if(method === 'POST'){
    const opt = { method:'POST', body: parts.join('&') };
    if(/^gb/i.test(siteCharset)) opt.charset = 'gbk';
    return { url: path + ',' + JSON.stringify(opt), post: true, kname, how: '已按网站搜索框生成 POST 搜索（参数 ' + kname + '）' };
  }
  return { url: path + (path.includes('?') ? '&' : '?') + parts.join('&'), post: false, kname, how: '已按网站搜索框生成搜索地址（参数 ' + kname + '）' };
}

async function sniffSearch(baseUrl){
  const pack = await grabDoc(baseUrl);
  const doc = pack.doc;
  const siteCharset = ((pack.html || '').match(/charset\s*=\s*["']?\s*([\w-]+)/i) || [])[1] || '';

  // ① 表单打分，挑最像"搜索"的那个
  let best = null;
  for(const f of doc.querySelectorAll('form')){
    const inputs = [...f.querySelectorAll('input')].filter(i=> (i.getAttribute('name')||'').trim());
    if(!inputs.length) continue;
    const action = f.getAttribute('action') || '';
    const ph = inputs.map(i=> i.getAttribute('placeholder') || '').join(' ');
    const btn = [...f.querySelectorAll('input[type=submit],button')].map(b=> clean(b.value || b.textContent || '')).join(' ');
    let score = 0;
    if(inputs.some(i=> SEARCH_KEY_NAMES.test(i.getAttribute('name')||''))) score += 4;
    if(/search|so\b|so\.|s\.php|e\/search/i.test(action)) score += 3;
    if(/搜索|输入|关键词|书名/i.test(ph + ' ' + btn)) score += 3;
    if((f.getAttribute('method')||'').toUpperCase() === 'POST') score += 1;
    if(score >= 3 && (!best || score > best.score)) best = { f, score };
  }
  if(best){
    const r = formSearchUrl(best.f, baseUrl, siteCharset);
    if(r) return r;
  }

  // ② 首页里的搜索入口链接
  const links = [...doc.querySelectorAll('a')].map(a=>absUrl(a.getAttribute('href')||'', baseUrl))
    .filter(u=>/search|so\.php|s\?/i.test(u));
  if(links.length){
    const base0 = baseUrl.replace(/\/+$/, '');
    const p = links[0].startsWith(base0 + '/') ? links[0].slice(base0.length) : links[0];
    return { url: p, post: false, how: '用了首页里的搜索入口链接（可能还需要手动补 {{key}}）' };
  }
  return null;
}

function sanitizeHtml(doc, base){
  const tmp = new DOMParser().parseFromString('<!DOCTYPE html>' + doc.documentElement.outerHTML, 'text/html');
  tmp.querySelectorAll('script,noscript,iframe,object,embed,base').forEach(n=>n.remove());
  tmp.querySelectorAll('meta[http-equiv]').forEach(n=>{
    const v = (n.getAttribute('http-equiv')||'').toLowerCase();
    if(v === 'refresh' || v === 'content-security-policy') n.remove();
  });
  const b = tmp.createElement('base');
  b.setAttribute('href', base);
  if(tmp.head) tmp.head.prepend(b);
  return tmp;
}

async function loadPickPage(url){
  const box = $('#pickFrame');
  const old = box.querySelector('iframe'); if(old) old.remove();
  const oldL = box.querySelector('.loading'); if(oldL) oldL.remove();
  const ld = document.createElement('div');
  ld.className = 'loading';
  ld.innerHTML = '<div class="spin"></div><div>正在打开网页…（首次可能要几秒）</div>';
  box.appendChild(ld);

  try{
    const pack = await grabDoc(url);
    const tmp = sanitizeHtml(pack.doc, pack.base);
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-same-origin');
    f.setAttribute('referrerpolicy', 'no-referrer');

    let done = false;
    const ready = ()=>{
      if(done) return; done = true;
      ld.remove();
      PK.doc = f.contentDocument;
      bindFrame(f);
    };
    f.onload = ready;
    f.srcdoc = '<!DOCTYPE html>' + tmp.documentElement.outerHTML;
    box.appendChild(f);
    setTimeout(()=>{ if(!done && f.contentDocument && f.contentDocument.body) ready(); }, 2500);
  }catch(e){
    ld.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:20px 16px;width:100%';

        实在不行，也可以把网页源码<b>手动贴进来</b>，点选功能完全一样。
      </div></div>`;
    const row = document.createElement('div');
    row.className = 'btn-row mt12';
    const b1 = document.createElement('button');
    b1.className = 'btn sm'; b1.textContent = '重新加载';
    b1.onclick = ()=> loadPickPage(url);
    const b2 = document.createElement('button');
    b2.className = 'btn sm pri'; b2.textContent = '手动粘贴网页';

    wrap.appendChild(row);
    ld.appendChild(wrap);
  }
}

function unhl(){
  if(HL && HL.style){
    HL.style.outline = HL.__ol || '';
    HL.style.outlineOffset = HL.__olo || '';
    HL.style.backgroundColor = HL.__bg || '';
  }
  HL = null;
}
function hl(el){
  if(!el || el === HL || !el.style) return;
  unhl();
  HL = el;
  el.__ol = el.style.outline; el.__olo = el.style.outlineOffset; el.__bg = el.style.backgroundColor;
  el.style.outline = '2px solid #48b8ff';
  el.style.outlineOffset = '-2px';
  el.style.backgroundColor = 'rgba(72,184,255,.15)';
}

function bindFrame(f){
  const d = f.contentDocument;
  if(!d){ toast('网页加载受限，可点「重新加载」或换代理'); return; }
  // 页面几乎是空的 → 给出针对性提示（POST 搜索站 / 脚本加载常见）
  try{
    const txt = clean((d.body && d.body.textContent) || '');
    if(txt.length < 40){
      const h = $('#pickHint');
      if(h) h.innerHTML = '<span style="color:var(--warn)">⚠️ 这个网页打开后几乎是空的。常见原因：① 网站用 POST 搜索，直接开网址不会出结果——请在<b>电脑浏览器</b>里搜一次书，在结果页按 Ctrl+U 复制源码，点右上角「手动粘贴网页」贴进来，点选功能完全一样；② 页面内容靠脚本加载（同理手动粘贴）。</span>';
    }
  }catch(e){}
  try{
    d.documentElement.style.cursor = 'crosshair';
  }catch(e){}
  d.addEventListener('mouseover', e=>{ hl(e.target); }, true);
  d.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    handlePick(e.target);
  }, true);
  d.addEventListener('submit', e=>{ e.preventDefault(); e.stopPropagation(); }, true);
  d.addEventListener('touchstart', e=>{ hl(e.target); }, {capture:true, passive:true});
}

function handlePick(el){
  const t = curTarget();
  if(!t) return;
  const r = buildRule(el, t.kind, t.listKey);
  r.el = el;
  PK.picked = r;
  const color = r.rule ? (r.value || r.count ? 'var(--ok)' : 'var(--warn)') : 'var(--err)';
  $('#pickSel').innerHTML =
    `<span style="color:${color}">${esc(r.note||'')}</span>` +
    (r.rule ? `<span class="sv">${esc(r.rule)}</span>` : '');
  $('#pickConfirm').disabled = !r.rule;
  hl(el);
}

function doPickConfirm(){
  const t = curTarget(); const r = PK.picked;
  if(!t || !r || !r.rule) return;
  setS(t.k, r.rule);

  // 智能联动：点书名/章节名时顺带把链接也填上
  if(t.linkTo && r.el && !clean(getS(t.linkTo))){
    const a = nearestTag(r.el, 'a');
    if(a){
      const p = r.base ? shortestPath(r.base, a, false) : pathFromDoc(a);
      setS(t.linkTo, (p || '') + '@href');
    }
  }
  saveLib();
  PK.picked = null;
  $('#pickConfirm').disabled = true;

  const idx = PK.targets.findIndex((x,i)=> i > PK.cur && !clean(getS(x.k)));
  const anyEmpty = PK.targets.findIndex(x=> !clean(getS(x.k)));
  if(idx >= 0) PK.cur = idx;
  else if(anyEmpty >= 0) PK.cur = anyEmpty;

  renderChips();
  const left = PK.targets.filter(x=> !clean(getS(x.k)) && !x.opt).length;
  if(left === 0){ toast('这一步点完了 ✓'); setTimeout(closePicker, 400); }
  else toast('已记录，还剩 ' + left + ' 项');
}

function field(k, l, ph, opt={}){
  const v = getS(k);
  if(opt.type === 'select'){
    return `<div class="f"><div class="f-h"><div class="f-l">${esc(l)}</div></div>
      <select data-k="${k}">${(opt.opts||[]).map((o,i)=>`<option value="${i}" ${Number(v)===i?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  const type = opt.type || 'text';
  const tag = opt.area ? 'textarea' : 'input';
  const val = v == null ? '' : v;
  const attrs = `${tag==='input'?`type="${type}"`:'rows="3"'} data-k="${k}" placeholder="${esc(ph||'')}" class="${opt.mono?'mono':''}"`;
  return `<div class="f">
    <div class="f-h"><div class="f-l">${esc(l)}</div>${opt.req?'<span class="badge r">必填</span>':''}<div class="sp"></div>${opt.adv?'<span class="badge">高级</span>':''}</div>
    ${tag==='input'
      ? `<input ${attrs} value="${esc(val)}">`
      : `<textarea ${attrs}>${esc(val)}</textarea>`}
    ${opt.tip?`<div class="f-tip">${opt.tip}</div>`:''}
  </div>`;
}

function realSearchUrl(keyword){
  const base = (S.bookSourceUrl||'').replace(/\/+$/,'');
  let u = S.searchUrl || '';
  // Legado 的 POST/选项写法：url,{json} —— 测试时只取网址部分
  const m = u.match(/^(.*?),(\{[\s\S]*\})$/);
  if(m){
    u = m[1];
    try{
      const opt = JSON.parse(m[2]);
      if(opt && opt.body) S._postBody = opt.body.split('{{key}}').join(encodeURIComponent(keyword || '小说'));
    }catch(e){}
  }
  u = u.split('{{key}}').join(encodeURIComponent(keyword || '小说'))
       .split('{{page}}').join('1');
  if(!/^https?:/i.test(u)) u = base + (u.startsWith('/') ? '' : '/') + u;
  return u;
}

function renderWizard(){
  const step = Math.max(0, Math.min(S._step||0, 7));
  const bar = '<div class="wsteps">' + WSTEPS.map((s,i)=>{
    const cls = i < step ? 'done' : (i === step ? 'cur' : '');
    return `<div class="wstep ${cls}"><div class="c">${i<step?'✓':i+1}</div><div class="lb">${s}</div></div>`;
  }).join('') + '</div>';

  let body = '';
  if(step === 0) body = wiz0();
  else if(step === 1) body = wiz1();
  else if(step === 2) body = wiz2();
  else if(step === 3) body = wiz3();
  else if(step === 4) body = wiz4();
  else if(step === 5) body = wiz5();
  else if(step === 6) body = wiz6();
  else body = wiz7();

  const prev = step > 0 ? `<button class="btn gho" data-wz="prev">← 上一步</button>` : '';
  const next = step < 7 ? `<button class="btn pri" data-wz="next" style="flex:1">下一步 →</button>` : '';
  const nav = `<div class="btn-row mt16" style="margin-top:18px">${prev}${next}</div>`;

  $('#pageWizard').innerHTML = bar + body + nav;
  bindWizardExtras();
}

function bindWizardExtras(){
  const cp = $('#cfCustomProxy');
  if(cp){
    cp.value = CFG.customProxy || '';
    cp.oninput = ()=>{ CFG.customProxy = cp.value.trim(); saveCfg(); };
  }
  const tp = $('#btnTestProxy');
  if(tp) tp.onclick = testProxies;

  // 分类标签：点一下选中/取消
  $$('#pageWizard .cat[data-cat]').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.cat;
      const arr = S._scanCats || [];
      if(!arr[i]) return;
      arr[i].on = !arr[i].on;
      syncScannedCats();
      renderWizard();
    };
  });
  // 分类标签上的 ✕：从清单里删掉
  $$('#pageWizard [data-dcat]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const i = +b.dataset.dcat;
      const items = exploreItems().slice();
      const gone = items.splice(i,1)[0];
      setExploreItems(items);
      if(Array.isArray(S._scanCats) && gone){
        S._scanCats.forEach(c=>{ if(c.url === gone.url || c.name === gone.name) c.on = false; });
      }
      renderWizard();
    };
  });
}

async function testProxies(){
  const out = $('#proxyTestOut');
  if(!out) return;
  const lines = [];
  out.innerHTML = '<div class="tiny mt8">测试中，每个最多等 8 秒…</div>';
  for(const p of proxyList()){
    const t0 = Date.now();
    try{
      const buf = await fetchOne(p.build('https://example.com'), 8000);
      const txt = decodeBuf(buf);
      lines.push((/example/i.test(txt) ? '✓ ' : '✗ ') + p.name + '  ' + (Date.now()-t0) + 'ms');
    }catch(e){
      lines.push('✗ ' + p.name + '  ' + (e.name === 'AbortError' ? '超时' : '不通'));
    }
    out.innerHTML = '<div class="mono-box sm mt8">' + lines.join('<br>') + '</div>';
  }
  const anyOk = lines.some(l=> l.startsWith('✓'));
  out.innerHTML = '<div class="mono-box sm mt8">' + lines.join('<br>') + '</div>' +
    (anyOk
      ? '<div class="note ok mt8"><span class="ico">✓</span><div>有可用通道，可以正常抓网页</div></div>'
      : '<div class="note warn mt8"><span class="ico">⚠️</span><div>全部不通。可以：① 换个网络再试；② 填自己的代理；③ 用「手动粘贴网页」。工具本身照常能用。</div></div>');
}

async function doSearch(keyword){
  const url = S._realSearchPage || realSearchUrl(keyword);
  const pack = await grabDoc(url);
  const root = pack.doc.documentElement;
  if(!clean(S.ruleSearch.bookList)) throw new Error('还没点选「书籍列表」，请先完成搜索页那一步');
  const list = resolveRule(S.ruleSearch.bookList, [root], url).els;
  if(!list.length) throw new Error('书籍列表没命中任何内容（规则可能需要调整）');
  const books = list.slice(0, 24).map(el=>({
    name:   ruleVal(S.ruleSearch.name, el, url),
    author: ruleVal(S.ruleSearch.author, el, url),
    url:    ruleVal(S.ruleSearch.bookUrl, el, url),
    cover:  ruleVal(S.ruleSearch.coverUrl, el, url),
    intro:  ruleVal(S.ruleSearch.intro, el, url),
  })).filter(b=> b.name || b.url);
  T.lastSearchUrl = url;
  return books;
}

async function doInfo(bookUrl){
  const pack = await grabDoc(bookUrl);
  const root = pack.doc.documentElement;
  const base = bookUrl;
  return {
    name:   ruleVal(S.ruleBookInfo.name, root, base) || '',
    author: ruleVal(S.ruleBookInfo.author, root, base) || '',
    cover:  ruleVal(S.ruleBookInfo.coverUrl, root, base) || '',
    intro:  ruleVal(S.ruleBookInfo.intro, root, base) || '',
    lastChapter: ruleVal(S.ruleBookInfo.lastChapter, root, base) || '',
    tocUrl: ruleVal(S.ruleBookInfo.tocUrl, root, base) || '',
    doc: pack.doc, base
  };
}

async function doToc(bookUrl, tocUrl){
  const url = tocUrl || bookUrl;
  const pack = await grabDoc(url);
  const root = pack.doc.documentElement;
  if(!clean(S.ruleToc.chapterList)) throw new Error('还没点选「章节列表」');
  const list = resolveRule(S.ruleToc.chapterList, [root], url).els;
  if(!list.length) throw new Error('章节列表没命中（规则可能需要调整）');
  return list.map(el=>({
    name: ruleVal(S.ruleToc.chapterName, el, url),
    url:  ruleVal(S.ruleToc.chapterUrl, el, url),
  })).filter(c=> c.url);
}

async function doContent(chUrl){
  const pack = await grabDoc(chUrl);
  const root = pack.doc.documentElement;
  if(!clean(S.ruleContent.content)) throw new Error('还没点选「正文」');
  let text = resolveRule(S.ruleContent.content, [root], chUrl).text || '';
  if(clean(S.ruleContent.replaceRegex)){
    for(const line of S.ruleContent.replaceRegex.split('\n')){
      const m = line.split('##');
      if(m[0]){
        try{ text = text.replace(new RegExp(m[0], 'g'), m[1]||''); }catch(e){}
      }
    }
  }
  return text;
}

const AI_STOP_RULES = `你是「阅读」App(Legado) 书源规则专家。你会收到网页 HTML，需要输出 Legado 选择器规则。
【只允许使用以下语法，不要发明别的写法】
- CSS 链用 @ 连接：class.类名 / id.名字 / tag.标签名 / text.文本
- 取值放最后一段：@text 纯文本、@html 内部HTML(含<br>换行)、@href 链接、@src 图片、@content、@value、@title、@alt
- 索引：段尾加 .数字，如 tag.dd.0 取第1个、tag.dd.-1 取最后1个；class.item.1 取 class=item 的第2个
- 兜底：用 || 连接多个候选，先命中的生效
- 页面本质是 JSON 时才用 JSONPath：$.data.list 等形式
- 严禁：@js:、<js></js>、{{}}、## 正则、CSS 伪类、组合选择器 div.a>p
规则要尽量短且稳定：优先 id.，其次有辨识度的 class.，避免依赖数字索引（除非同一结构重复出现取第几个）。`;

function slimHtml(html, limit){
  limit = limit || 42000;
  let d;
  try{ d = parseHtml(html, ''); }catch(e){ return String(html||'').slice(0, limit); }
  try{
    d.querySelectorAll('script,style,noscript,svg,iframe,link,meta,head,comment').forEach(n=>n.remove());
  }catch(e){}
  let out = '';
  try{
    out = d.body ? d.body.innerHTML : d.documentElement.innerHTML;
  }catch(e){ out = String(html||''); }
  out = out.replace(/<!--[\s\S]*?-->/g,'').replace(/\n\s*\n/g,'\n').replace(/[ \t]{2,}/g,' ');
  if(out.length > limit) out = out.slice(0, limit) + '\n<!--TRUNCATED-->';
  return out;
}

function aiJSON(txt){
  txt = String(txt||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a < 0 || b <= a) throw new Error('AI 没有返回 JSON：' + trunc(txt, 120));
  return JSON.parse(txt.slice(a, b+1));
}

/** 拆 Legado 的 url,{json} 写法 */
function splitLegadoUrl(u){
  u = String(u||'').trim();
  const m = u.match(/^(.*?),(\{[\s\S]*\})$/);
  if(m){
    try{ return { path:m[1], opt: JSON.parse(m[2]) }; }catch(e){ return { path:u, opt:null }; }
  }
  return { path:u, opt:null };
}

/** 把 searchUrl 变成真实可访问的地址 */
function aiRealSearchUrl(base, searchUrl, keyword){
  const sp = splitLegadoUrl(searchUrl);
  let u = sp.path.split('{{key}}').join(encodeURIComponent(keyword||''))
              .split('{{page}}').join('1');
  if(sp.opt && sp.opt.body) sp.opt.body = String(sp.opt.body).split('{{key}}').join(encodeURIComponent(keyword||''));
  if(!/^https?:/i.test(u)) u = base.replace(/\/+$/,'') + (u.startsWith('/') ? '' : '/') + u;
  return { url:u, opt:sp.opt, isPost: !!(sp.opt && /^post$/i.test(sp.opt.method||'')) };
}

/** 按配置拼 API 请求地址（支持 ?url= 与 {url} 两种代理前缀） */
function aiUrlOf(path){
  let url = clean(AI.base).replace(/\/+$/,'') + path;
  if(!/^https?:/i.test(url)) url = 'https://' + url;
  const p = clean(AI.prefix);
  if(p){
    if(p.includes('{url}')) url = p.split('{url}').join(encodeURIComponent(url));
    else if(/[=?&]$/.test(p)) url = p + encodeURIComponent(url);   // 网址参数形式：https://xx/?url=
    else url = p.replace(/\/+$/,'') + '/' + url;                    // 路径形式：https://xx/api
  }
  return url;
}

async function aiChat(messages, maxTokens){
  if(!clean(AI.base) || !clean(AI.key)) throw new Error('请先在上方填好 API 地址和 API Key');
  const url = aiUrlOf('/chat/completions');
  const ctl = new AbortController();
  const tm = setTimeout(()=>ctl.abort(), 120000);
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + AI.key.trim() },
      body: JSON.stringify({
        model: clean(AI.model) || 'gpt-4o-mini',
        messages, temperature:0.2,
        max_tokens: maxTokens || 2200,
      }),
      signal: ctl.signal,
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('API 返回 ' + res.status + '：' + trunc(t, 180));
    }
    const data = await res.json();
    const txt = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!txt) throw new Error('API 返回为空（检查模型名是否正确）');
    return txt;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('请求超时（120 秒）');
    if(e.name === 'TypeError' || e instanceof TypeError) throw new Error('浏览器无法直连这个 API（多为跨域限制）。解决办法：换支持浏览器调用的中转站；或在「API 请求代理」里填一个支持 POST 转发的代理地址（worker.js 已支持）。');
    throw e;
  }finally{ clearTimeout(tm); }
}

/** 让 AI 生成并本地验证，最多重试 1 次 */
async function aiGen(buildMsgs, validate){
  let lastErr = '', lastAns = '';
  for(let i=0; i<2; i++){
    if(AISTOP.stop) throw new Error('已停止');
    const msgs = buildMsgs(lastErr);
    let raw;
    try{ raw = await aiChat(msgs); }
    catch(e){ lastErr = e.message; if(i===0) continue; throw e; }
    let obj;
    try{ obj = aiJSON(raw); }
    catch(e){ lastErr = e.message; lastAns = raw; continue; }
    lastAns = raw;
    const v = validate(obj);
    if(v === true) return obj;
    lastErr = typeof v === 'string' ? v : '规则校验未通过';
  }
  throw new Error('AI 两次都没做对：' + lastErr);
}

      <div class="f-h"><div class="f-l">小说站首页网址</div><span class="badge r">必填</span></div>
      <input type="url" id="aiUrl" class="mono" placeholder="https://www.xxx.com" value="${esc(AISTOP.url||'')}">
    </div>
    <div class="f">
      <div class="f-h"><div class="f-l">测试搜的书名</div></div>
      <input type="text" id="aiKw" placeholder="用来让 AI 看到真实搜索结果，越常见越好" value="${esc(AISTOP.kw||'斗破苍穹')}">
    </div>
    <div class="row" style="border:0;padding-top:2px">
      <div class="rl">顺便做「发现」分类<div class="rd">AI 从首页认出分类，能在 App 里逛书库</div></div>
      <button class="sw ${AISTOP.explore === false ? '' : 'on'}" id="aiExpSw"></button>
    </div>
    <div class="btn-row mt12">
      ${running
        ? `<button class="btn warn" style="flex:1" id="aiStop">■ 停止</button>`
        : `<button class="btn pri" style="flex:1" id="aiGo">🤖 开始自动制作</button>`}
    </div>
    <div class="tiny mt8">全程约 1-2 分钟：AI 会看首页 → 试搜一次书 → 看详情页 → 看目录 → 看正文，每一步都会在本机验证规则是否真的抓得到。</div>
  </div>

  ${AISTEPS.length ? `<div id="aiOut">${cards}</div>` : ''}
  <div id="aiDone"></div>`;

  // 绑定
  $('#aiBase').oninput = e=>{ AI.base = e.target.value.trim(); saveAI(); };
  $('#aiKey').oninput  = e=>{ AI.key  = e.target.value.trim(); saveAI(); };
  $('#aiModel').oninput= e=>{ AI.model= e.target.value.trim(); saveAI(); };
  $('#aiPrefix').oninput=e=>{ AI.prefix=e.target.value.trim(); saveAI(); };
  $('#aiTestConn').onclick = aiTestConn;
  $('#aiFetchModels').onclick = aiFetchModels;
  $('#aiExpSw').onclick = e=>{ AISTOP.explore = AISTOP.explore === false ? true : false; e.target.classList.toggle('on', AISTOP.explore !== false); };
  if($('#aiGo')) $('#aiGo').onclick = ()=> aiBuild();
  if($('#aiStop')) $('#aiStop').onclick = ()=>{ AISTOP.stop = true; toast('正在停止…（当前这一步完成后停下）'); };
}

/** 拉取 /models 模型列表，填进 datalist 供下拉选择 */
async function aiFetchModels(){
  if(!clean(AI.base) || !clean(AI.key)) return toast('先填 API 地址和 Key');
  const btn = $('#aiFetchModels'), stat = $('#aiConnStat');
  btn.disabled = true; btn.textContent = '拉取中…';
  if(stat) stat.textContent = '正在拉取模型列表…';
  try{
    const res = await fetch(aiUrlOf('/models'), { headers:{ 'Authorization':'Bearer ' + AI.key.trim() } });
    if(!res.ok){
      if(stat) stat.textContent = '';
      return toast('拉取失败：API 返回 ' + res.status + (res.status===401||res.status===403 ? '（Key 无效或无权限）' : ''));
    }
    const d = await res.json();
    const arr = Array.isArray(d) ? d : (Array.isArray(d.data) ? d.data : (Array.isArray(d.models) ? d.models : []));
    let list = [];
    arr.forEach(m=>{
      if(typeof m === 'string') list.push(m);
      else if(m && (m.id || m.name || m.model)) list.push(m.id || m.name || m.model);
    });
    list = [...new Set(list)].sort((a,b)=> a.localeCompare(b));
    if(!list.length){
      if(stat) stat.textContent = '';
      return toast('接口没返回模型列表，请手动填模型名');
    }
    AI.models = list; saveAI();
    const dl = $('#aiModelList');
    if(dl) dl.innerHTML = list.slice(0,500).map(m=>`<option value="${esc(m)}">`).join('');
    // 没填模型名时，帮用户挑个便宜常用的
    if(!clean(AI.model)){
      const pref = list.find(m=>/flash|mini|lite|free|glm-4-flash|deepseek-chat/i.test(m)) || list[0];
      AI.model = pref; saveAI();
      const inp = $('#aiModel'); if(inp) inp.value = pref;
    }
    if(stat) stat.textContent = '✓ 已拉取 ' + list.length + ' 个模型' + (clean(AI.model) ? '，当前选中 ' + AI.model : '') + '（在「模型名」输入框点一下可下拉选择）';
    toast('拉到 ' + list.length + ' 个模型');
  }catch(e){
    if(stat) stat.textContent = '';
    toast(e.name==='AbortError' ? '请求超时' : (e.name==='TypeError' ? '连不上：多为跨域限制，需要填「API 请求代理」' : (e.message||'拉取失败')));
  }
  btn.disabled = false; btn.textContent = '拉取模型列表';
}

/** 测试连接：真实发一条对话，验证 Key 和模型都可用 */
async function aiTestConn(){
  if(!clean(AI.base) || !clean(AI.key)) return toast('先填 API 地址和 Key');
  const btn = $('#aiTestConn'), stat = $('#aiConnStat');
  btn.disabled = true; btn.textContent = '测试中…';
  if(stat) stat.textContent = '正在真实发一条消息测试…';
  const t0 = Date.now();
  try{
    const res = await fetch(aiUrlOf('/chat/completions'), {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + AI.key.trim() },
      body: JSON.stringify({
        model: clean(AI.model) || 'gpt-4o-mini',
        messages:[{ role:'user', content:'只回复两个字：成功' }],
        temperature:0, max_tokens:200,
      }),
    });
    const ms = Date.now() - t0;
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      const why = (res.status===401||res.status===403) ? 'Key 无效或无权限'
                : res.status===404 ? '地址不对（检查是否以 /v1 结尾）'
                : (res.status===400 && /model/i.test(t)) ? '模型名可能不对：' + (clean(AI.model)||'（未填）')
                : 'API 返回 ' + res.status;
      if(stat) stat.textContent = '';
      return toast('测试失败：' + why + (t ? ' · ' + trunc(t, 120) : ''));
    }
    const d = await res.json();
    const reply = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || '';
    if(stat) stat.textContent = '✓ 连接成功 · 耗时 ' + ms + 'ms · 模型回复：' + (trunc(reply, 40) || '（空）');
    toast('测试通过（' + ms + 'ms）');
  }catch(e){
    if(stat) stat.textContent = '';
    toast(e.name==='AbortError' ? '请求超时' : (e.name==='TypeError' ? '连不上：多为跨域限制，需要填「API 请求代理」' : (e.message||'测试失败')));
  }
  btn.disabled = false; btn.textContent = '测试连接';
}

/* ---- 主流程 ---- */
async function aiBuild(){
  const homeUrl = clean($('#aiUrl') && $('#aiUrl').value);
  const kw = clean($('#aiKw') && $('#aiKw').value) || '斗破苍穹';
  const wantExplore = AISTOP.explore !== false;
  if(!homeUrl) return toast('先填小说站首页网址');
  if(!clean(AI.base) || !clean(AI.key)) return toast('先在 API 设置里填好地址和 Key');

  AISTOP = { stop:false, url:homeUrl, kw, explore:wantExplore };
  AISTEPS = [
    { t:'分析网站首页', st:'run' },
    { t:'生成搜索规则', st:'wait' },
    { t:'生成详情和目录规则', st:'wait' },
    { t:'生成正文规则', st:'wait' },
    { t:'生成分类（发现）', st:'wait' },
  ];
  if(!wantExplore) AISTEPS[4].st = 'skip';
  renderAI();

  const paint = ()=>{ const out = $('#aiOut'); if(out) out.innerHTML = AISTEPS.map((s,i)=>tcard(i+1, s.t, s.st, s.detail||'')).join(''); };
  const setp = (t, st, detail)=>{ aiStep(t, st, detail); paint(); };

  try{
    /* 1. 首页 → 搜索地址 */
    const home = await grabDoc(homeUrl);
    const homeHtml = slimHtml(home.html);
    const site = await aiGen(
      (err)=>[
        { role:'system', content: AI_STOP_RULES },
        { role:'user', content:
          `这是小说网站首页的 HTML（可能已截断）。请找出它的搜索地址。\n` +
          `要求：\n` +
          `1. 看页面里的 <form>：如果搜索是 GET（关键词会出现在网址里），输出形如 /search.php?keyword={{key}} 的路径，关键词位置用 {{key}} 代替。\n` +
          `2. 如果表单 method 是 POST（搜什么书网址都不变），输出 Legado 格式：/s.php,{"method":"POST","body":"searchkey={{key}}&submit=搜索"}，参数名用表单里文本输入框的 name，保留所有 hidden 输入框；body 里的中文值先 URL 编码不必要，保持原样即可。\n` +
          `3. 页面编码是 gb2312/gbk 时在 JSON 里加 "charset":"gbk"。\n` +
          `4. 顺便给出站点名。\n` +
          `只输出 JSON：{"name":"站点名","searchUrl":"…","charset":"utf-8"}。找不到搜索入口就 searchUrl 填 ""。` +
          (err ? '\n\n上一次输出有问题：' + err + '，请重新输出。' : '') +
          `\n\nHTML：\n${homeHtml}` }
      ],
      (o)=>{
        if(!o || typeof o !== 'object') return '不是合法 JSON 对象';
        return true;   // searchUrl 为空也算成功，后面单独处理
      }
    ) || {};

    const srcName = clean(site.name) || host(homeUrl).replace(/^www\./,'');
    if(site.searchUrl){
      S.bookSourceName = srcName;
      S.bookSourceUrl = homeUrl;
      let su = site.searchUrl;
      if(site.charset && !/utf-?8/i.test(site.charset) && !/charset/.test(su)) su += ',{"charset":"' + site.charset + '"}';
      // 若 AI 已带 ,{json} 而我们又加了 charset，避免双后缀
      const sp = splitLegadoUrl(su);
      if(sp.opt){
        const merged = Object.assign({}, sp.opt);
        if(site.charset && !/utf-?8/i.test(site.charset) && !merged.charset) merged.charset = site.charset;
        su = sp.path + ',' + JSON.stringify(merged);
      }
      S.searchUrl = su;
    }else{
      S.bookSourceName = srcName;
      S.bookSourceUrl = homeUrl;
    }
    saveLib(); updateHeader();

    if(!site.searchUrl){
      setp('分析网站首页', 'warn', `<div class="tiny">AI 没能在首页找到搜索入口。书源名称和首页已填好，搜索部分请回向导手动点选完成。</div>`);
      finishAI('AI 只完成了基础信息，搜索规则需要用向导手动做。');
      return;
    }

    const rs = aiRealSearchUrl(homeUrl, S.searchUrl, kw);
    setp('分析网站首页', 'ok', `<div class="kv"><div class="k">站点</div><div class="v">${esc(S.bookSourceName)}</div></div><div class="kv"><div class="k">搜索</div><div class="v">${esc(S.searchUrl)}</div></div>`);

    /* 2. 搜索结果页 → ruleSearch */
    if(rs.isPost){
      setp('生成搜索规则', 'warn',
        `<div class="note warn mt8"><span class="ico">ℹ️</span><div>这是 <b>POST 搜索</b>站，浏览器里没法预演搜索结果页，AI 只写好了搜索地址。搜索规则请在向导里<b>手动点选一次</b>（电脑浏览器搜一次书 → 手动粘贴网页），或在 App 里直接验证。</div></div>`);
    }else{
      setp('生成搜索规则', 'run');
      let searchPack = null;
      try{ searchPack = await grabDoc(rs.url); }
      catch(e){ setp('生成搜索规则', 'err', `<div class="tiny">搜索结果页打不开：${esc(e.message)}</div>`); throw e; }
      const sh = slimHtml(searchPack.html);
      const rules = await aiGen(
        (err)=>[
          { role:'system', content: AI_STOP_RULES },
          { role:'user', content:
            `这是小说站「${esc(srcName)}」搜索“${esc(kw)}”的结果页 HTML。请生成书源搜索规则。\n` +
            `书籍列表 = 包含每一本书完整信息（封面/书名/作者等）的、在页面上重复出现的最小元素。\n` +
            `name/bookUrl 的规则是相对「一本书的元素」的，不要再写 bookList 的路径。\n` +
            `bookUrl 取详情页链接（通常是书名或封面所在 <a> 的 @href）。封面图注意常见懒加载属性 data-src / data-original 优先于 src。\n` +
            `author/coverUrl/intro 找不到就填 ""。\n` +
            (err ? `上一次输出的问题：${err}，请修正。\n` : '') +
            `只输出 JSON：{"bookList":"…","name":"…","bookUrl":"…","author":"","coverUrl":"","intro":""}\n\nHTML：\n${sh}` }
        ],
        (o)=>{
          const need = ['bookList','name','bookUrl'];
          for(const k of need){ if(!clean(o[k])) return '缺少 ' + k; }
          const root = searchPack.doc.documentElement;
          const list = resolveRule(o.bookList, [root], searchPack.base).els;
          if(list.length < 1) return 'bookList 在页面上没命中任何元素：' + o.bookList;
          const first = list.find(el=> resolveRule(o.name, [el], searchPack.base).els.length && clean(resolveRule(o.name,[el],searchPack.base).text));
          if(!first) return '用 name 规则在列表项里取不到书名：' + o.name;
          const bu = clean(resolveRule(o.bookUrl, [first], searchPack.base).text);
          if(!bu) return '用 bookUrl 规则取不到链接：' + o.bookUrl;
          S._aiFirstBook = absUrl(bu, searchPack.base);
          return true;
        }
      );
      S.ruleSearch.bookList = rules.bookList;
      S.ruleSearch.name = rules.name;
      S.ruleSearch.bookUrl = rules.bookUrl;
      S.ruleSearch.author = rules.author || '';
      S.ruleSearch.coverUrl = rules.coverUrl || '';
      S.ruleSearch.intro = rules.intro || '';
      const nBooks = resolveRule(rules.bookList, [searchPack.doc.documentElement], searchPack.base).els.length;
      setp('生成搜索规则', 'ok', `<div class="kv"><div class="k">书单</div><div class="v">${esc(rules.bookList)}（命中 ${nBooks} 本）</div></div><div class="kv"><div class="k">书名</div><div class="v">${esc(rules.name)}</div></div>`);
      saveLib();
    }

    /* 3. 详情页 + 目录 */
    setp('生成详情和目录规则', 'run');
    let detailUrl = clean(S._aiFirstBook);
    if(!detailUrl){
      // POST 搜索等拿不到书的情况：让 AI 从首页猜一本热门书的详情页链接
      const guess = await aiGen(
        (err)=>[
          { role:'system', content: AI_STOP_RULES },
          { role:'user', content:
            `这是小说站首页 HTML。找出任意一本小说详情页的完整链接（首页推荐位、排行榜里都有）。` +
            (err ? '上一次输出有问题：' + err + '。' : '') +
            `只输出 JSON：{"bookUrl":"https://…"}` +
            `\n\nHTML：\n${homeHtml}` }
        ],
        (o)=> /^https?:\/\/./.test(o.bookUrl||'') ? true : 'bookUrl 不是完整网址'
      );
      detailUrl = guess.bookUrl;
    }
    const infoPack = await grabDoc(detailUrl);
    const ih = slimHtml(infoPack.html);
    const dRules = await aiGen(
      (err)=>[
        { role:'system', content: AI_STOP_RULES },
        { role:'user', content:
          `这是小说站一本书的详情页 HTML。请生成详情规则和目录规则。\n` +
          `1. name/author/coverUrl/intro：详情页上的书名、作者、封面图、简介（找不到填 ""）。\n` +
          `2. tocUrl：仅当章节列表在另一个单独页面时才填（多数站详情页本身就是目录页，填 ""）。\n` +
          `3. chapterList：包含每个章节条目的、重复出现的最小元素（如 tag.dd、class.item 的 li）。注意区分正序目录和倒序目录都不用管，只给列表规则。\n` +
          `4. chapterName / chapterUrl：相对章节条目的规则，一般是 tag.a@text 和 tag.a@href。\n` +
          (err ? `上一次输出的问题：${err}，请修正。\n` : '') +
          `只输出 JSON：{"name":"","author":"","coverUrl":"","intro":"","tocUrl":"","chapterList":"","chapterName":"","chapterUrl":""}\n\nHTML：\n${ih}` }
      ],
      (o)=>{
        if(!clean(o.chapterList)) return '缺少 chapterList';
        if(!clean(o.chapterName) || !clean(o.chapterUrl)) return '缺少 chapterName/chapterUrl';
        const root = infoPack.doc.documentElement;
        const list = resolveRule(o.chapterList, [root], infoPack.base).els;
        if(list.length < 3) return 'chapterList 命中太少（' + list.length + ' 个），可能选错元素';
        const c0 = list[0];
        const cn = clean(resolveRule(o.chapterName, [c0], infoPack.base).text);
        const cu = clean(resolveRule(o.chapterUrl, [c0], infoPack.base).text);
        if(!cn) return 'chapterName 取不到文字：' + o.chapterName;
        if(!cu) return 'chapterUrl 取不到链接：' + o.chapterUrl;
        S._aiFirstChapter = absUrl(cu, infoPack.base);
        return true;
      }
    );
    S.ruleBookInfo.name = dRules.name || '';
    S.ruleBookInfo.author = dRules.author || '';
    S.ruleBookInfo.coverUrl = dRules.coverUrl || '';
    S.ruleBookInfo.intro = dRules.intro || '';
    S.ruleBookInfo.tocUrl = dRules.tocUrl || '';
    S.ruleToc.chapterList = dRules.chapterList;
    S.ruleToc.chapterName = dRules.chapterName;
    S.ruleToc.chapterUrl = dRules.chapterUrl;
    const nCh = resolveRule(dRules.chapterList, [infoPack.doc.documentElement], infoPack.base).els.length;
    setp('生成详情和目录规则', 'ok', `<div class="kv"><div class="k">目录</div><div class="v">${esc(dRules.chapterList)}（命中 ${nCh} 章）</div></div>`);
    saveLib();

    /* 4. 正文 */
    setp('生成正文规则', 'run');
    const chUrl = clean(S._aiFirstChapter);
    const chPack = await grabDoc(chUrl);
    const ch = slimHtml(chPack.html);
    const cRules = await aiGen(
      (err)=>[
        { role:'system', content: AI_STOP_RULES },
        { role:'user', content:
          `这是小说站一章正文的页面 HTML。请生成正文规则。\n` +
          `1. content：包住整章文字的容器，用 @html 取值保住换行（一般是 id.xxx@html 或 class.xxx@html）。要选文字最多的那个正文容器，不要选包含整页的（body、wrapper 之类不行）。\n` +
          `2. nextContentUrl：仅当这一章正文被分成多页、页面里有"下一页"链接时才填，否则 ""。\n` +
          (err ? `上一次输出的问题：${err}，请修正。\n` : '') +
          `只输出 JSON：{"content":"","nextContentUrl":""}\n\nHTML：\n${ch}` }
      ],
      (o)=>{
        if(!clean(o.content)) return '缺少 content';
        const root = chPack.doc.documentElement;
        const txt = clean(resolveRule(o.content, [root], chPack.base).text || '');
        if(txt.length < 100) return 'content 取到的正文太短（' + txt.length + ' 字），可能选错容器';
        return true;
      }
    );
    S.ruleContent.content = cRules.content;
    S.ruleContent.nextContentUrl = cRules.nextContentUrl || '';
    const cTxt = clean(resolveRule(cRules.content, [chPack.doc.documentElement], chPack.base).text || '');
    setp('生成正文规则', 'ok', `<div class="kv"><div class="k">正文</div><div class="v">${esc(cRules.content)}（本章 ${cTxt.length} 字）</div></div>`);
    saveLib();

    /* 5. 分类（发现） */
    if(wantExplore){
      setp('生成分类（发现）', 'run');
      try{
        const cats = await aiGen(
          (err)=>[
            { role:'system', content: AI_STOP_RULES },
            { role:'user', content:
              `这是小说站首页 HTML。找出导航里的小说分类入口（玄幻、都市、修仙、排行榜、完本这类），最多 15 个。\n` +
              `要求：只要站内链接（忽略首页/登录/APP下载/外站）；网址是相对路径就给相对路径；如果分类网址带页码，把页码换成 {{page}}（如 /sort/1/{{page}}.html 或 /sort/{{page}}/），第一页通常是 1。\n` +
              (err ? `上一次输出的问题：${err}，请修正。\n` : '') +
              `只输出 JSON：{"categories":[{"name":"玄幻","url":"/sort/1/"}]}\n\nHTML：\n${homeHtml}` }
          ],
          (o)=> Array.isArray(o.categories) && o.categories.length ? true : 'categories 为空'
        );
        const items = cats.categories
          .filter(c=> clean(c.name) && clean(c.url))
          .slice(0, 15)
          .map(c=> ({ name: clean(c.name).slice(0,10), url: clean(c.url) }));
        // 分类页的书，多数站和搜索结果同构：先复用搜索规则，抽第一个分类验证
        S._cats = items;
        S.exploreUrl = buildExploreUrl(items);
        if(clean(S.ruleSearch.bookList)){
          S.ruleExplore.bookList = S.ruleSearch.bookList;
          S.ruleExplore.name = S.ruleSearch.name;
          S.ruleExplore.bookUrl = S.ruleSearch.bookUrl;
          S.ruleExplore.author = S.ruleSearch.author;
          S.ruleExplore.coverUrl = S.ruleSearch.coverUrl;
          try{
            const e0 = explorePageUrl(items[0].url, 1);
            const ep = await grabDoc(e0);
            const n = resolveRule(S.ruleExplore.bookList, [ep.doc.documentElement], ep.base).els.length;
            setp('生成分类（发现）', n > 0 ? 'ok' : 'warn',
              `<div class="kv"><div class="k">分类</div><div class="v">${items.length} 个：${esc(items.slice(0,6).map(c=>c.name).join('、'))}${items.length>6?'…':''}</div></div>` +
              (n > 0 ? `<div class="tiny">分类页抽查：命中 ${n} 本书</div>` : `<div class="tiny">分类页结构和搜索页不同，规则可能要在分类页重新点选（向导第 7 步）</div>`));
          }catch(e){
            setp('生成分类（发现）', 'warn', `<div class="tiny">${items.length} 个分类已写入，但分类页没能打开验证：${esc(e.message)}</div>`);
          }
        }else{
          setp('生成分类（发现）', 'ok', `<div class="kv"><div class="k">分类</div><div class="v">${items.length} 个已写入</div></div><div class="tiny">搜索规则为空（POST 站），分类页规则需在向导第 7 步点选</div>`);
        }
        saveLib();
      }catch(e){
        setp('生成分类（发现）', 'warn', `<div class="tiny">跳过：${esc(e.message)}</div>`);
      }
    }

    finishAI(null);
  }catch(e){
    const cur = AISTEPS.find(s=>s.st === 'run');
    if(cur && cur.st === 'run') setp(cur.t, 'err', `<div class="note err mt8"><span class="ico">⚠️</span><div>${esc(e.message)}</div></div>`);
    finishAI(e.message);
  }
}

function finishAI(errMsg){
  const core = coreCount();
  S._step = 7;
  saveLib(); updateHeader();
  const done = $('#aiDone');
  if(!done) return;
  if(errMsg){
    done.innerHTML = `<div class="note warn mt12"><span class="ico">⚠️</span><div><b>中途停下</b>：${esc(errMsg)}<br>已生成的部分都保存了，可以补跑，或回向导手动点选。</div></div>
    <div class="btn-row mt12"><button class="btn" style="flex:1" onclick="goTab('wizard')">去向导补</button></div>`;
  }else if(core >= 4){
    done.innerHTML = `<div class="note ok mt12"><span class="ico">🎉</span><div><b>AI 做完了</b>，规则都已写入并逐条验证过。建议跑一遍全链路测试再导出。</div></div>
    <div class="btn-row mt12">
      <button class="btn pri" style="flex:1" onclick="goTab('test')">去测试</button>
      <button class="btn ok" style="flex:1" onclick="goTab('export')">去导出</button>
    </div>`;
  }else{
    done.innerHTML = `<div class="note mt12"><span class="ico">ℹ️</span><div>AI 完成了它能做的部分（还差 ${4-core} 项核心规则，多为 POST 搜索站）。回向导手动点选补齐即可。</div></div>
    <div class="btn-row mt12"><button class="btn pri" style="flex:1" onclick="goTab('wizard')">去向导</button></div>`;

}

function showBusy(txt){
  const box = $('#pickFrame');
  box.querySelectorAll('iframe,.loading').forEach(n=> n.remove());
  const ld = document.createElement('div');
