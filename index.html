/* ---------- 向导动作 ---------- */
async function handleWz(a){
  const step = S._step || 0;
  if(a === 'prev'){ S._step = Math.max(0, step-1); saveLib(); renderWizard(); window.scrollTo(0,0); return; }
  if(a === 'next') return wzNext();
  if(a === 'goTest'){ goTab('test'); setTimeout(()=>runAll(), 120); return; }
  if(a === 'goExport'){ goTab('export'); return; }

  /* ---- 发现 / 分类 ---- */
  if(a === 'scanCat'){
    if(!clean(S.bookSourceUrl)) return toast('先把网站首页填上');
    showBusy('正在扫描网站的分类入口…');
    try{
      const list = await scanCategories();
      hideBusy();
      const prev = exploreItems();
      S._scanCats = list.map(c=>{
        const hit = prev.find(p=> p.name === c.name || p.url === c.url);
        return { name:c.name, url: pageTemplatize(c.url) || c.url, on: !!hit };
      });
      if(!prev.length) S._scanCats.forEach((c,i)=>{ c.on = i < 12; });
      syncScannedCats();
      renderWizard();
      toast(list.length ? '扫到 ' + list.length + ' 个分类' : '没自动认出分类，试试手动添加');
    }catch(e){ hideBusy(); toast('扫描失败：' + e.message); }
    return;
  }
  if(a === 'catAll' || a === 'catNone'){
    (S._scanCats || []).forEach(c=>{ c.on = (a === 'catAll'); });
    syncScannedCats(); renderWizard();
    return;
  }
  if(a === 'addCat'){
    const nm = clean($('#catName') && $('#catName').value);
    let u = clean($('#catUrl') && $('#catUrl').value);
    if(!nm || !u) return toast('分类名和网址都要填');
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    const tpl = pageTemplatize(u);
    if(tpl) u = tpl;
    const base = (clean(S.bookSourceUrl) || '').replace(/\/+$/, '');
    if(base && u.startsWith(base + '/')) u = u.slice(base.length);
    const items = exploreItems().slice();
    if(items.some(x=> x.url === u)) return toast('这个分类已经加过了');
    items.push({ name:nm, url:u });
    setExploreItems(items); renderWizard();
    toast(tpl ? '已添加，并自动支持翻页' : '已添加');
    return;
  }
  if(a === 'pickExplore'){
    const items = exploreItems();
    if(!items.length) return toast('先选至少一个分类');
    let u = clean(S._explorePickUrl);
    if(!u) u = explorePageUrl(items[0].url, 1);
    openPicker(u, TGT.explore, ()=>{ saveLib(); renderWizard(); }, '分类页 · 点选（' + (items[0].name || '第一个分类') + '）');
    return;
  }

  if(a === 'genSearch'){
    const purl = clean($('#wzPage') && $('#wzPage').value);
    const kw = clean($('#wzKey') && $('#wzKey').value);
    S._kw = kw; S._realSearchPage = purl;
    if(!purl) return toast('先把搜索结果页的网址贴进来');
    const r = buildSearchUrl(purl, kw);
    if(r.ok){
      setS('searchUrl', r.url); saveLib(); renderWizard();
      return toast('搜索地址已生成 ✓');
    }
    // 网址里没书名 → 大概率是 POST 搜索（网址不变），去网站首页分析搜索框
    toast('网址里没找到书名，正在分析网站的搜索方式…');
    return handleWz('sniff');
  }

  if(a === 'genPost'){
    // 手动兜底：按用户填的参数名生成 POST 搜索地址
    const purl = clean($('#wzPage') && $('#wzPage').value) || clean(S.bookSourceUrl);
    const name = clean($('#postKey') && $('#postKey').value) || 'searchkey';
    if(!purl) return toast('先把搜索页网址填上');
    let path = purl;
    const base = (clean(S.bookSourceUrl) || '').replace(/\/+$/, '');
    if(base && path.startsWith(base + '/')) path = path.slice(base.length);
    if(!path.startsWith('/')) path = '/' + path.replace(/^https?:\/\/[^/]+/i, '');
    const url = path + ',' + JSON.stringify({ method:'POST', body: name + '={{key}}' });
    setS('searchUrl', url); saveLib(); renderWizard();
    toast('已生成 POST 搜索地址（参数 ' + name + '）');
    return;
  }

  if(a === 'sniff'){
    if(!clean(S.bookSourceUrl)) return toast('先把网站首页填上');
    showBusy('正在分析网站的搜索方式…');
    try{
      const r = await sniffSearch(S.bookSourceUrl);
      hideBusy();
      if(!r) return toast('没自动认出搜索方式，可展开「网址里没有书名」手动填参数名');
      setS('searchUrl', r.url); saveLib(); renderWizard();
      toast(r.how);
    }catch(e){ hideBusy(); toast(e.message); }
    return;
  }

  if(a === 'pickSearch'){
    let url = clean(S._realSearchPage);
    if(!url){
      if(!clean(S.searchUrl)) return toast('先完成上一步：生成搜索地址');
      url = realSearchUrl(S._kw || '小说');
    }
    openPicker(url, TGT.search, ()=>{ saveLib(); renderWizard(); }, '搜索结果页 · 点选');
    return;
  }

  if(a === 'pickInfo'){
    let u = clean($('#wzDetail') && $('#wzDetail').value) || clean(S._detailUrl);
    if(!u){
      showBusy('正在搜索第一本书…');
      try{ u = await firstBookUrl(); }
      catch(e){ hideBusy(); return toast(e.message); }
    }
    S._detailUrl = u; saveLib();
    openPicker(u, TGT.info, ()=>{ saveLib(); renderWizard(); }, '详情页 · 点选');
    return;
  }

  if(a === 'pickToc'){
    showBusy('正在打开目录页…');
    try{
      const b = clean(S._detailUrl) || await firstBookUrl();
      let tocUrl = '';
      if(clean(S.ruleBookInfo.tocUrl)){
        const info = await doInfo(b).catch(()=>null);
        if(info) tocUrl = info.tocUrl;
      }
      openPicker(tocUrl || b, TGT.toc, ()=>{ saveLib(); renderWizard(); }, '目录页 · 点选');
    }catch(e){ hideBusy(); toast(e.message); }
    return;
  }

  if(a === 'pickContent'){
    showBusy('正在打开第一章…');
    try{
      const u = await firstChapterUrl();
      openPicker(u, TGT.content, ()=>{ saveLib(); renderWizard(); }, '正文 · 点选');
    }catch(e){ hideBusy(); toast(e.message); }
    return;
  }
}

function wzNext(){
  const step = S._step || 0;
  if(step === 0){
    let u = clean(S.bookSourceUrl);
    if(!u) return toast('先把网站首页填上');
    if(!/^https?:\/\//i.test(u)){ u = 'https://' + u; setS('bookSourceUrl', u); }
    if(!clean(S.bookSourceName)) setS('bookSourceName', host(u) || '我的书源');
  }
  if(step === 1){
    if(!clean(S.searchUrl)) return toast('先点「自动生成搜索地址」，或者手动填一个');
  }
  S._step = Math.min(7, step + 1);
  saveLib(); renderWizard(); updateHeader(); window.scrollTo(0,0);
}

function tcard(n, title, st, body){
  const cls = st === 'ok' ? 'done' : st === 'err' ? 'err' : st === 'run' ? 'run' : '';
  const tag = st === 'ok' ? '<span class="badge g">通过</span>'
            : st === 'err' ? '<span class="badge" style="color:var(--err);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.12)">没通过</span>'
            : st === 'run' ? '<span class="badge y">进行中</span>'
            : st === 'skip' ? '<span class="badge">未配置</span>' : '';
  return `<div class="tstep">
    <div class="tstep-h"><div class="tnum ${cls}">${st==='ok'?'✓':st==='err'?'!':n}</div>
      <div class="tt">${esc(title)}</div>${tag}</div>
    ${body || ''}
  </div>`;
}

  <div class="res-list">${books.slice(0,5).map(b=>`
    <div class="book">
      ${b.cover?`<img src="${esc(b.cover)}" loading="lazy" onerror="this.style.opacity=.15">`:'<div style="width:44px;height:60px;border-radius:7px;background:var(--card2);flex:none"></div>'}
      <div class="bi"><div class="bn">${esc(b.name||'（书名没取到）')}</div>
      <div class="ba">${esc(b.author||'作者未知')}</div>
      <div class="bm">${esc(trunc(b.url,42))}</div></div>
    </div>`).join('')}</div>`;
}

function errBox(e, step){
  const isPost = /"method"\s*:\s*"POST"/i.test(S.searchUrl || '');
  let tips = {
    1:['搜索地址里的关键词没被替换（检查有没有 {{key}}）','网站把搜索结果放在 iframe 或需要登录','搜索地址填成了首页'],
    2:['详情链接规则取到的是空值','网站对非浏览器访问做了拦截（试试填请求头）'],
    3:['目录不在详情页，需要单独填「目录页链接」','章节规则只命中了标题栏'],
    4:['正文用了 @text 丢了换行，试试改成 @html','站点做了分页，正文分了好几页'],
    5:['分类页网址填错了，或者网站改版了','第一个分类的第一页正好没有书（换个分类排前面）','分类页的书结构和搜索页不一样，要单独点选'],
  }[step] || [];
  if(isPost && (step === 1 || step === 2)){
    tips = ['这个网站用 <b>POST 方式搜索</b>，网页版测试拿不到结果，<b>书源在 App 里通常是能用的</b>，建议直接导出后到 App 里搜一次书验证'].concat(tips);
  }
  return `<div class="note err mt8"><span class="ico">⚠️</span><div>
    <b>${esc(e.message||'出错了')}</b>
    ${tips.length?'<div class="mt8 tiny" style="color:#c9a6a6">可能的原因：</div><ul class="ol" style="color:#c9a6a6;font-size:12px">'+tips.map(t=>'<li>'+t+'</li>').join('')+'</ul>':''}
  </div></div>`;
}

async function runAll(){
  const out = $('#testOut');
  const kw = clean($('#testKw').value) || clean(S._kw) || '小说';
  S._kw = kw; saveLib();

  const ph = (n,t)=> tcard(n,t,'run') + [1,2,3,4].filter(x=>x>n).map(x=>tcard(x,['搜索书籍','打开详情页','抓目录','抓正文'][x-1],'wait')).join('');
  out.innerHTML = ph(1);

  let books, info, chapters, content;

  try{
    books = await doSearch(kw);
    out.innerHTML = tcard(1,'搜索书籍', books.length?'ok':'err', booksHtml(books)) + ph(2);
    if(!books.length) return;
  }catch(e){ out.innerHTML = tcard(1,'搜索书籍','err', errBox(e,1)); return; }

  const b = books.find(x=> x.url);
  if(!b){ out.innerHTML = tcard(1,'搜索书籍','ok',booksHtml(books)) + tcard(2,'打开详情页','err', errBox({message:'拿到书了，但没有详情链接'},2)); return; }

  try{
    info = await doInfo(b.url);
    const rows = [
      ['书名', info.name], ['作者', info.author], ['简介', info.intro ? trunc(info.intro,80) : ''],
    ].map(([k,v])=>`<div class="kv"><div class="k">${k}</div><div class="v ${v?'':'miss'}">${v?esc(v):'没取到'}</div></div>`).join('');
    out.innerHTML = tcard(1,'搜索书籍','ok',booksHtml(books))
      + tcard(2,'打开详情页','ok', rows + `<div class="kv"><div class="k">封面</div><div class="v ${info.cover?'':'miss'}">${info.cover?('<img src="'+esc(info.cover)+'" style="height:54px;border-radius:5px" onerror="this.style.display=\'none\'">'):'没取到（不影响使用）'}</div></div>`)
      + ph(3);
  }catch(e){ out.innerHTML = tcard(1,'搜索书籍','ok',booksHtml(books)) + tcard(2,'打开详情页','err', errBox(e,2)); return; }

  try{
    chapters = await doToc(b.url, info.tocUrl);
    const list = chapters.slice(0,6).map(c=>`<div class="chap"><div class="cn">${esc(c.name||'（无名）')}</div></div>`).join('');
    out.innerHTML = tcard(1,'搜索书籍','ok',`<div class="tiny">${books.length} 本</div>`)
      + tcard(2,'打开详情页','ok',`<div class="tiny">${esc(info.name||b.name)}</div>`)
      + tcard(3,'抓目录','ok',`<div class="tiny">共 ${chapters.length} 章，前 6 章：</div>${list}`)
      + ph(4);
  }catch(e){ out.innerHTML = tcard(1,'搜索书籍','ok',`<div class="tiny">${books.length} 本</div>`)
      + tcard(2,'打开详情页','ok',`<div class="tiny">${esc(info.name||b.name)}</div>`)
      + tcard(3,'抓目录','err', errBox(e,3)); return; }

  try{
    content = await doContent(chapters[0].url);
    const okLen = clean(content).length > 100;
    const ex = await exploreCardHtml();
    out.innerHTML = tcard(1,'搜索书籍','ok',`<div class="tiny">${books.length} 本</div>`)
      + tcard(2,'打开详情页','ok',`<div class="tiny">${esc(info.name||b.name)}</div>`)
      + tcard(3,'抓目录','ok',`<div class="tiny">共 ${chapters.length} 章</div>`)
      + tcard(4,'抓正文', okLen?'ok':'err',
          `<div class="kv"><div class="k">章节</div><div class="v">${esc(chapters[0].name||'第一章')}</div></div>
           <div class="kv"><div class="k">字数</div><div class="v">${clean(content).length} 字</div></div>
           <div class="mono-box sm mt8">${esc(trunc(content, 320))}</div>
           ${okLen?'':'<div class="note warn mt8"><span class="ico">⚠️</span><div>抓到的内容太短，正文规则可能没点准</div></div>'}`)
      + ex
      + `<div class="note ok mt12"><span class="ico">🎉</span><div><b>全链路通过</b>，可以导出了。</div></div>
         <div class="btn-row mt12"><button class="btn pri wide" onclick="goTab('export')">去导出书源</button></div>`;
  }catch(e){
    out.innerHTML = tcard(1,'搜索书籍','ok',`<div class="tiny">${books.length} 本</div>`)
      + tcard(2,'打开详情页','ok',`<div class="tiny">${esc(info.name||b.name)}</div>`)
      + tcard(3,'抓目录','ok',`<div class="tiny">共 ${chapters.length} 章</div>`)
      + tcard(4,'抓正文','err', errBox(e,4));
  }
}

/** 测试第 5 项：分类浏览（没配就显示“未配置”，不算失败） */
async function exploreCardHtml(){
  const items = exploreItems();
  if(!items.length || !clean(S.ruleExplore.bookList)){
    return tcard(5,'分类浏览','skip',
      `<div class="tiny">没配置「发现」。App 里就只能靠搜书名，没有分类页可逛。想加的话回向导「发现」那一步。</div>`);
  }
  try{
    const r = await doExplore(1);
    const names = items.map(x=> x.name).filter(Boolean);
    return tcard(5,'分类浏览','ok',
      `<div class="kv"><div class="k">分类</div><div class="v">${esc(names.slice(0,8).join(' / '))}${names.length>8?' 等 '+names.length+' 个':''}</div></div>
       <div class="kv"><div class="k">测试页</div><div class="v">${esc(r.item.name||'第一个分类')} · 第 1 页 · 共 ${r.total} 本</div></div>
       ${booksHtml(r.books)}`);
  }catch(e){
    return tcard(5,'分类浏览','err', errBox(e,5));
  }
}

/* ============================================================
   Part 12 · 导出 / 导入
   ============================================================ */
function toLegado(s){
  const r = (m, keys)=>{
    const o = {};
    keys.forEach(k=> o[k] = (m && m[k]) || '');
    return o;
  };
  return {
    bookSourceComment: s.bookSourceComment || '',
    bookSourceGroup: s.bookSourceGroup || '',
    bookSourceName: s.bookSourceName || '未命名书源',
    bookSourceType: Number(s.bookSourceType) || 0,
    bookSourceUrl: (s.bookSourceUrl || '').replace(/\/+$/,''),
    bookUrlPattern: s.bookUrlPattern || '',
    customOrder: Number(s.customOrder) || 0,
    enabled: s.enabled !== false,
    enabledCookieJar: s.enabledCookieJar !== false,
    enabledExplore: s.enabledExplore !== false,
    exploreUrl: s.exploreUrl || '',
    header: s.header || '',
    lastUpdateTime: Date.now(),
    respondTime: Number(s.respondTime) || 180000,
    searchUrl: s.searchUrl || '',
    weight: Number(s.weight) || 0,
    ruleSearch: r(s.ruleSearch, ['author','bookList','bookUrl','checkKeyWord','coverUrl','intro','kind','lastChapter','name','wordCount']),
    ruleBookInfo: r(s.ruleBookInfo, ['author','canReName','coverUrl','intro','kind','lastChapter','name','tocUrl','wordCount']),
    ruleToc: r(s.ruleToc, ['chapterList','chapterName','chapterUrl','isVolume','nextTocUrl','updateTime']),
    ruleContent: r(s.ruleContent, ['content','nextContentUrl','replaceRegex','sourceRegex','webJs']),
    ruleExplore: r(s.ruleExplore, ['author','bookList','bookUrl','coverUrl','intro','kind','lastChapter','name','wordCount'])
  };
}

function exportJson(collection){
  const one = toLegado(S);
  const txt = collection ? JSON.stringify([one], null, 2) : JSON.stringify(one, null, 2);
  return txt;
}

function copyText(t){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(t);
  }
  return new Promise((res, rej)=>{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
    ta.remove();
  });
}

function download(filename, text){
  const blob = new Blob([text], { type:'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

function renderExport(){
  const name = clean(S.bookSourceName) || '我的书源';
  const json = exportJson(false);
  const miss = [];
  if(!clean(S.searchUrl)) miss.push('搜索地址');
  if(!clean(S.ruleSearch.bookList)) miss.push('书籍列表');
  if(!clean(S.ruleToc.chapterList)) miss.push('章节列表');
  if(!clean(S.ruleContent.content)) miss.push('正文');
  const cats = exploreItems();
  const expOk = cats.length > 0 && clean(S.ruleExplore.bookList) !== '';

  $('#pageExport').innerHTML = `
  <div class="wiz-t">导出书源</div>
  <div class="wiz-d">点「复制」或「下载」，然后按下面的步骤导入到阅读 App 里。</div>
  ${miss.length?`<div class="note warn"><span class="ico">⚠️</span><div>还差 <b>${miss.join('、')}</b> 没填，导入后可能用不了。建议先回向导补完。</div></div>`:
    `<div class="note ok"><span class="ico">✅</span><div>规则齐全，可以导出了。</div></div>`}
  ${expOk
    ? `<div class="note ok"><span class="ico">🧭</span><div>已配 <b>${cats.length}</b> 个分类（${esc(cats.slice(0,5).map(c=>c.name||'未命名').join('、'))}${cats.length>5?'…':''}），App 的「发现」页可以直接用。</div></div>`
    : `<div class="note"><span class="ico">🧭</span><div>没配「发现」分类，导入后 App 里只能用搜索，没有分类页可逛。想加的话回向导「发现」那一步。</div></div>`}

  <div class="btn-row mt12">
    <button class="btn pri" style="flex:1" id="btnCopy">复制书源</button>
    <button class="btn" style="flex:1" id="btnDl">下载 JSON</button>
  </div>

  <div class="sec-h mt16"><b>预览</b><div class="ln"></div></div>
  <div class="mono-box">${esc(json)}</div>

  <div class="sec-h mt16"><b>怎么导入到阅读 App</b><div class="ln"></div></div>
  <div class="card">
    <div class="ol">
      <li>打开<b>阅读</b>（Legado），点底部 <b>我的</b> → <b>书源管理</b></li>
      <li>点右上角 <b>⋮</b> → <b>新建书源</b>，再点右上角 <b>⋮</b> → <b>从剪贴板导入</b></li>
      <li>刚才复制的就是书源内容，直接导入即可</li>
      <li>或者用<b>本地导入</b>，选刚下载的 ${esc(name)}.json</li>
    </ol>
    <div class="tiny mt8">导进去之后，在书源列表里能看到「${esc(name)}」，搜书就能用了。</div>
  </div>

  <div class="sec-h mt16"><b>管理</b><div class="ln"></div></div>
  <div class="card">
    <div class="btn-row">
      <button class="btn gho" style="flex:1" id="btnCopyAll">复制全部（${LIB.length} 个）</button>
      <button class="btn gho" style="flex:1" id="btnDlAll">下载合集</button>
    </div>
    <div class="sep"></div>
    <div class="f">
      <div class="f-h"><div class="f-l">导入已有书源（粘贴 JSON）</div></div>
      <textarea id="importTxt" class="mono" rows="3" placeholder='粘贴单个书源 {…} 或合集 [{…},{…}]'></textarea>
    </div>
    <button class="btn wide mt8" id="btnDoImport">导入</button>
  </div>`;

  $('#btnCopy').onclick = ()=> copyText(json).then(()=> toast('已复制，去阅读里「从剪贴板导入」')).catch(()=> toast('复制失败，长按下方预览手动复制'));
  $('#btnDl').onclick = ()=> download(name + '.json', json);
  $('#btnCopyAll').onclick = ()=> copyText(JSON.stringify(LIB.map(toLegado), null, 2)).then(()=> toast('已复制合集')).catch(()=> toast('复制失败'));
  $('#btnDlAll').onclick = ()=> download('书源合集.json', JSON.stringify(LIB.map(toLegado), null, 2));
  $('#btnDoImport').onclick = ()=> doImport(clean($('#importTxt').value));
}

function doImport(text){
  if(!text) return toast('先粘贴书源 JSON');
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ return toast('不是合法的 JSON（首尾可能被截断）'); }
  const arr = Array.isArray(data) ? data : [data];
  let n = 0;
  arr.forEach(o=>{
    if(!o || typeof o !== 'object' || !o.bookSourceUrl) return;
    const s = Object.assign(blankSource(), {
      bookSourceName: o.bookSourceName || '', bookSourceUrl: o.bookSourceUrl || '',
      bookSourceGroup: o.bookSourceGroup || '', bookSourceComment: o.bookSourceComment || '',
      bookSourceType: o.bookSourceType || 0, searchUrl: o.searchUrl || '',
      header: o.header || '', exploreUrl: o.exploreUrl || '', bookUrlPattern: o.bookUrlPattern || '',
      ruleSearch: Object.assign(blankSource().ruleSearch, o.ruleSearch||{}),
      ruleBookInfo: Object.assign(blankSource().ruleBookInfo, o.ruleBookInfo||{}),
      ruleToc: Object.assign(blankSource().ruleToc, o.ruleToc||{}),
      ruleContent: Object.assign(blankSource().ruleContent, o.ruleContent||{}),
      ruleExplore: Object.assign(blankSource().ruleExplore, o.ruleExplore||{}),
    });
    s._step = 7;
    LIB.push(s); n++;
  });
  if(!n) return toast('没识别出书源（缺少 bookSourceUrl）');
  CUR = LIB.length - 1; S = LIB[CUR];
  saveLib(); renderLib(); renderWizard(); updateHeader();
  toast('导入 ' + n + ' 个书源');
}

/* ============================================================
   Part 13 · 书源库 / 初始化
   ============================================================ */
function renderLib(){
  const box = $('#libList');
  box.innerHTML = LIB.map((s,i)=>{
    const n = (s.ruleSearch && s.ruleSearch.bookList ? 1:0) + (s.ruleToc && s.ruleToc.chapterList ? 1:0) + (s.ruleContent && s.ruleContent.content ? 1:0);
    return `<div class="libitem ${i===CUR?'on':''}" data-i="${i}">
      <div class="li"><div class="ln">${esc(s.bookSourceName || '未命名书源')}</div>
      <div class="ls">${esc(host(s.bookSourceUrl) || '还没填网址')} · ${n}/3 步已配</div></div>
      ${LIB.length>1?`<button class="x" data-del="${i}">✕</button>`:''}
    </div>`;
  }).join('');
  $$('.libitem', box).forEach(it=>{
    it.onclick = e=>{
      if(e.target.dataset.del != null) return;
      CUR = +it.dataset.i; S = LIB[CUR];
      saveLib(); renderLib(); renderWizard(); updateHeader();
      $('#drawer').classList.remove('on'); $('#mask').classList.remove('on');
    };
  });
  $$('[data-del]', box).forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    const i = +b.dataset.del;
    if(!confirm('删除「' + (LIB[i].bookSourceName||'未命名') + '」？')) return;
    LIB.splice(i,1);
    CUR = Math.min(CUR, LIB.length-1); S = LIB[CUR];
    saveLib(); renderLib(); renderWizard(); updateHeader();
    toast('已删除');
  });
}

function newSource(){
  LIB.push(blankSource());
  CUR = LIB.length - 1; S = LIB[CUR];
  saveLib(); renderLib(); renderWizard(); updateHeader();
  goTab('wizard');
  toast('新建了一个空书源');
}

function bindGlobal(){
  $$('nav.tabbar button').forEach(b=> b.onclick = ()=> goTab(b.dataset.tab));

  $('#btnDrawer').onclick = ()=>{ renderLib(); $('#drawer').classList.add('on'); $('#mask').classList.add('on'); };
  $('#mask').onclick = ()=>{ $('#drawer').classList.remove('on'); $('#mask').classList.remove('on'); };
  $('#btnNew').onclick = ()=> newSource();
  $('#btnAddLib').onclick = ()=>{ $('#drawer').classList.remove('on'); $('#mask').classList.remove('on'); newSource(); };
  $('#btnSave').onclick = ()=>{ saveLib(); toast('已保存到本机'); updateHeader(); };
  $('#btnImport').onclick = ()=> $('#fileInput').click();

  $('#fileInput').onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ doImport(await f.text()); }catch(err){ toast('读取失败'); }
    e.target.value = '';
  };

  // 点选器按钮
  $('#pickClose').onclick = ()=>{ closePicker(); };
  $('#pickSkip').onclick = ()=>{ closePicker(); };
  $('#pickConfirm').onclick = ()=> doPickConfirm();

  // 手动粘贴网页
  $('#hmClose').onclick = closeHtmlModal;
  $('#hmOk').onclick = useManualHtml;
  $('#hmFile').onclick = ()=> $('#hmFileInput').click();
  $('#hmFileInput').onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      $('#hmText').value = await f.text();
      toast('已读取，点下面按钮继续');
    }catch(err){ toast('读取失败'); }
    e.target.value = '';
  };

  // 输入
  document.addEventListener('input', e=>{
    const k = e.target.dataset && e.target.dataset.k;
    if(!k) return;
    setS(k, e.target.value);
    if(k === 'exploreUrl') S._cats = null;   // 手改过就以文本为准
    if(k === 'bookSourceName') updateHeader();
    saveLibSoon();
  });
  document.addEventListener('change', e=>{
    const k = e.target.dataset && e.target.dataset.k;
    if(!k) return;
    setS(k, e.target.value);
    saveLibSoon(); updateHeader();
  });
  document.addEventListener('click', e=>{
    const sw = e.target.closest && e.target.closest('[data-sw]');
    if(sw){
      const k = sw.dataset.sw;
      setS(k, !getS(k));
      sw.classList.toggle('on', !!getS(k));
      saveLib();
    }
    const wz = e.target.closest && e.target.closest('[data-wz]');
    if(wz) handleWz(wz.dataset.wz);
  });

  // 页面级函数暴露（供内联 onclick 使用）
  window.goTab = goTab;
}

let booted = false;
function boot(){
  if(booted) return; booted = true;
  loadCfg(); loadLib(); loadAI();
  S = LIB[CUR];
  if(typeof S._step !== 'number') S._step = 0;
  bindGlobal();
  renderLib();
  updateHeader();
  renderWizard();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
